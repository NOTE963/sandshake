    else if (a === 'vs') show('vVs');
    else if (a === 'vsRandom') startMatch('random');
    else if (a === 'vsKey') startMatch('kw');
    else if (a === 'cancelWait') cancelMatch();
    else if (a === 'lobbyStart') hostStart();
    else if (a === 'rankBot') openRankStart();
    else if (a === 'rankBotStart') startRankMatch();
  });

  // ============================================================
  //  Versus mode (2-4 players, Firestore rooms + anonymous auth)
  // ============================================================
  const ATK_RATE = 0.5;
  const BOT_NAME = 'CPU★ごうけつ';
  const MAX_PLAYERS = 5;
  const MW = W / 2, MH = H / 2;
  const vsBarEl = $('vsBar');
  const vs = {
    on: false, ended: false,
    fs: null, db: null, uid: null, rid: null, ref: null, myRef: null, hitsCol: null,
    opps: [], unsubs: [], seenHits: new Set(),
    seq: 0, lastSendTick: 0, dirty: false, lastKey: '',
    dead: false, myPlace: 0, myReason: ''
  };
  let specWatch = null;
  let match = null, matchToken = 0;

  function setVsUi(on) {
    versus = on;
    if (!on) botMode = false;
    vsBarEl.hidden = !on;
    $('lvLabel').textContent = on ? 'おじゃま' : 'レベル';
  }
  function openRankStart() {
    show('vRankStart');
    const ti = tierInfo(rp);
    const img = $('rsBadgeImg');
    img.src = TIER_ICON[ti.name] || ''; img.alt = ti.name;
    $('rsBadgeText').textContent = ti.name + '(RP ' + rp + ')';
  }
  const expireAt = () => vs.fs.Timestamp.fromMillis(Date.now() + 86400000);

  // ---- compact board snapshot: 2x2 downsample + run-length encoding ----
  function encodeGrid() {
    let out = '', prev = -1, run = 0;
    for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
      const i = (y * 2) * W + x * 2;
      const cnt = [0, 0, 0, 0, 0, 0];
      cnt[g[i]]++; cnt[g[i + 1]]++; cnt[g[i + W]]++; cnt[g[i + W + 1]]++;
      let v = 0, best = 0;
      if (4 - cnt[0] >= 2) for (let k = 1; k <= 5; k++) if (cnt[k] > best) { best = cnt[k]; v = k; }
      if (v === prev) run++;
      else { if (prev >= 0) out += prev + '' + run + '.'; prev = v; run = 1; }
    }
    return out + prev + '' + run + '.';
  }
  function decodeGrid(str, dst) {
    dst.fill(0);
    let p = 0;
    for (const t of str.split('.')) {
      if (!t) continue;
      const v = t.charCodeAt(0) - 48, n = parseInt(t.slice(1), 10) || 0;
      for (let k = 0; k < n && p < dst.length; k++) dst[p++] = v;
    }
  }

  // ---- opponent cards (small containers at the top) ----
  function buildCards(others) {
    vsBarEl.innerHTML = '';
    vs.opps = others.map(pl => {
      const card = document.createElement('div'); card.className = 'oppCard';
      const wrap = document.createElement('div'); wrap.className = 'miniWrap';
      const frameEl = document.createElement('div'); frameEl.className = 'miniFrame';
      const cvs = document.createElement('canvas'); cvs.className = 'miniCv'; cvs.width = MW; cvs.height = MH;
      frameEl.appendChild(cvs); wrap.appendChild(frameEl);
      const mark = document.createElement('div'); mark.className = 'deadMark'; mark.textContent = '×'; wrap.appendChild(mark);
      const info = document.createElement('div'); info.className = 'oppInfo';
      const nm = document.createElement('span'); nm.textContent = pl.name;
      const sc = document.createElement('b'); sc.textContent = '0';
      info.append(nm, sc);
      card.append(wrap, info);
      vsBarEl.appendChild(card);
      const c2 = cvs.getContext('2d'), im = c2.createImageData(MW, MH);
      const o = {
        uid: pl.uid, name: pl.name, grid: new Uint8Array(MW * MH), th: 0, miniTh: 0, blob: null,
        score: 0, dead: false, gone: false, place: 0, lastRecv: performance.now(),
        card, frameEl, ctx: c2, img: im, buf: new Uint32Array(im.data.buffer), scEl: sc, spill: 0
      };
      card.addEventListener('click', () => { if (state === 'spectate' && !o.dead && !o.gone) setWatch(o); });
      return o;
    });
    vs.opps.forEach(drawMini);
  }
  function drawMini(o) {
    const gr = o.grid, mb = o.buf;
    for (let i = 0; i < gr.length; i++) { const c = gr[i]; mb[i] = (c >= 1 && c <= 5) ? pal[(c - 1) * SHADES + 3] : 0; }
    const b = o.blob;
    if (b && b.c >= 1 && b.c <= 5 && !o.dead) {
      const bx = Math.round(b.x / 2), bw = Math.max(1, Math.round(b.w / 2)), bh = Math.max(1, Math.round(b.h / 2));
      const col = ((pal[(b.c - 1) * SHADES + 5] & 0x00FFFFFF) | 0x99000000) >>> 0;
      for (let y = 0; y < bh && y < MH; y++) for (let x = bx; x < bx + bw && x < MW; x++) if (!gr[y * MW + x]) mb[y * MW + x] = col;
    }
    o.ctx.putImageData(o.img, 0, 0);
  }
  function applyMini(o) {
    const r = o.miniTh * Math.PI / 180, c = Math.abs(Math.cos(r)), sn = Math.abs(Math.sin(r));
    const fw = 60, fh = 68;
    const bw = fw * c + fh * sn, bh = fw * sn + fh * c;
    const k = Math.min(1, 84 / bw, 76 / bh);
    o.frameEl.style.transform = 'rotate(' + o.miniTh.toFixed(2) + 'deg) scale(' + k.toFixed(3) + ')';
  }
  // shortest signed angular distance from a to b, in degrees (-180..180]
  function angDelta(a, b) { let d = (b - a) % 360; if (d > 180) d -= 360; if (d < -180) d += 360; return d; }
  function vsAnimate(dt) {
    for (const o of vs.opps) {
      o.miniTh += angDelta(o.miniTh, o.th) * Math.min(1, dt * 0.014);
      applyMini(o);
    }
  }
  function markDead(o) {
    o.card.classList.add('dead');
    drawMini(o);
    if (state === 'spectate' && o === specWatch) pickWatch();
  }

  // ---- state sync ----
  function stateData(dead, place) {
    return {
      g: encodeGrid(), th: Math.round(thetaT), dx: Math.round(dropX),
      dc: cur ? cur.c : 0, dw: cur ? cur.w : 0, dh: cur ? cur.h : 0,
      sc: score, sp: spilled, dead, place, seq: ++vs.seq, expireAt: expireAt()
    };
  }
  function vsSend() {
    if (!vs.on || vs.ended) return;
    const d = stateData(false, 0);
    const key = [d.g, d.th, d.dx, d.dc, d.sc, d.sp].join('|');
    if (key === vs.lastKey && vsTicks - vs.lastSendTick < 180) return;
    vs.lastKey = key; vs.lastSendTick = vsTicks; vs.dirty = false;
    vs.fs.setDoc(vs.myRef, d).catch(e => console.warn('state send failed', e));
  }
  function onOppState(o, d) {
    o.lastRecv = performance.now();
    if (typeof d.g === 'string') decodeGrid(d.g, o.grid);
    o.th = d.th || 0;
    o.blob = { c: d.dc | 0, w: d.dw | 0, h: d.dh | 0, x: d.dx | 0 };
    o.score = d.sc | 0;
    o.scEl.textContent = o.score;
    o.spill = d.sp | 0;
    if (o === specWatch) syncSpecHud();
    if (d.dead === true && !o.dead) { o.dead = true; o.place = d.place | 0; markDead(o); checkWin(); return; }
    drawMini(o);
  }
  function onHit(id, d) {
    if (vs.dead || vs.seenHits.has(id)) return;
    vs.seenHits.add(id);
    let got = 0;
    if (Array.isArray(d.a)) for (let k = 0; k < 5; k++) {
      const n = Math.max(0, d.a[k] | 0);
      if (n > 0) { garbageQ[k] = Math.min(600, garbageQ[k] + n); got += n; }
    }
    if (got > 0) { Sfx.incoming(); updateHUD(); }
  }

  // attack: cleared sand goes to a random surviving opponent
  function vsAttack(groups, combo) {
    const alive = vs.opps.filter(o => !o.dead && !o.gone);
    if (!alive.length) return;
    const mult = 1 + 0.2 * Math.min(combo, 5);
    const a = [0, 0, 0, 0, 0];
    let sent = 0;
    for (let q = 0; q < groups.length; q += 2) {
      const amt = Math.floor(groups[q + 1] * ATK_RATE * mult);
      a[groups[q] - 1] += amt; sent += amt;
    }
    if (sent <= 0) return;
    const t = alive[Math.floor(Math.random() * alive.length)];
    if (t.uid === 'bot') botReceiveAttack(a);
    else vs.fs.addDoc(vs.hitsCol, { from: vs.uid, to: t.uid, a, expireAt: expireAt() }).catch(e => console.warn('hit failed', e));
    Sfx.send();
    t.card.classList.remove('hit'); void t.card.offsetWidth; t.card.classList.add('hit');
    setTimeout(() => t.card.classList.remove('hit'), 500);
  }

  // garbage: received sand pours in from the top as a stream
  function pourTick() {
    if (GY < 0) return;
    let k = 0;
    while (k < 5 && garbageQ[k] <= 0) k++;
    if (k >= 5) { pourColor = -1; return; }
    if (pourColor !== k) { pourColor = k; pourX = 2 + Math.floor(Math.random() * (W - 9)); }
    let placed = 0;
    for (let a = 0; a < 5 && garbageQ[k] > 0; a++) {
      const i = pourX + a;
      if (!g[i]) { g[i] = k + 1; sh[i] = Math.floor(Math.random() * SHADES); garbageQ[k]--; placed++; }
    }
    if (!placed) pourX = Math.max(0, Math.min(W - 5, pourX + (Math.random() < 0.5 ? -3 : 3)));
    else if (frameNo % 6 === 0) updateHUD();
    if (garbageQ.every(n => n <= 0)) updateHUD();
  }
  function vsTick() {
    vsTicks++;
    pourTick();
    if (botMode) {
      botTick();
    } else {
      const since = vsTicks - vs.lastSendTick;
      if (since >= 60 || (vs.dirty && since >= 20)) vsSend();
      if (vsTicks > 300 && vsTicks % 30 === 0) {
        const now = performance.now();
        for (const o of vs.opps) {
          if (!o.dead && !o.gone && now - o.lastRecv > 12000) { o.gone = true; o.place = 0; markDead(o); }
        }
      }
    }
    checkWin();
  }

  // ---- elimination / victory ----
  const aliveCount = () => 1 + vs.opps.filter(o => !o.dead && !o.gone).length;
  const aliveOpps = () => vs.opps.filter(o => !o.dead && !o.gone);
  function checkWin() {
    if (!vs.on || vs.ended) return;
    if (raceMode) return; // race mode only ends via the clock (finishRace), not by elimination
    if (state === 'spectate') { if (aliveOpps().length <= 1) endSpectate(); return; }
    if (state !== 'play') return;
    if (vs.opps.every(o => o.dead || o.gone)) vsWin();
  }
  function vsEliminate(reason) {
    if (!vs.on || vs.ended || vs.dead) return;
    const place = aliveCount();
    if (!botMode) vs.fs.setDoc(vs.myRef, stateData(true, place)).catch(() => {});
    vs.dead = true; vs.myPlace = place; vs.myReason = reason;
    if (place >= 3) startSpectate();      // others are still fighting: watch them
    else finishVersus(place, reason);
  }
  function vsWin() {
    if (!vs.on || vs.ended) return;
    if (!botMode) vs.fs.updateDoc(vs.ref, { status: 'finished', winnerUid: vs.uid, reason: 'last' }).catch(() => {});
    finishVersus(1, 'last');
  }

  // ---- spectating (after being eliminated while the match goes on) ----
  function startSpectate() {
    state = 'spectate';
    dragOn = false;
    document.body.classList.add('spec');
    frame.classList.add('spec');
    $('pad').hidden = true;
    $('specPad').hidden = false;
    $('lv').textContent = '-';
    pickWatch();
    Sfx.over();
    try { navigator.vibrate && navigator.vibrate([80, 40, 80]); } catch (e) {}
  }
  function pickWatch() {
    const a = aliveOpps();
    if (!a.length) { specWatch = null; return; }
    setWatch(a.includes(specWatch) ? specWatch : a[0]);
  }
  function setWatch(o) {
    specWatch = o;
    vs.opps.forEach(x => x.card.classList.toggle('watch', x === o));
    const b = $('specBar');
    b.hidden = false;
    b.textContent = '脱落 ' + vs.myPlace + '位 ・ 観戦中: ' + o.name;
    syncSpecHud();
  }
  function syncSpecHud() {
    const o = specWatch;
    if (!o) return;
    $('score').textContent = o.score;
    const sp = $('spill');
    sp.textContent = o.spill + '/' + SPILL_MAX;
    sp.classList.toggle('warn', o.spill > SPILL_MAX * 0.5);
    $('chip').style.background = (o.blob && o.blob.c >= 1 && o.blob.c <= 5) ? PAL[o.blob.c - 1] : '#999';
  }
  function stepWatch(dir) {
    const a = aliveOpps();
    if (!a.length) return;
    let i = a.indexOf(specWatch);
    i = (i + dir + a.length) % a.length;
    setWatch(a[i]);
    Sfx.click();
  }
  function endSpectUi() {
    specWatch = null;
    document.body.classList.remove('spec');
    frame.classList.remove('spec');
    $('pad').hidden = false;
    $('specPad').hidden = true;
    $('specBar').hidden = true;
    vs.opps.forEach(x => x.card.classList.remove('watch'));
  }
  // paint the watched player's (downsampled) board into the main frame
  function fillSpectate(o) {
    const gr = o.grid;
    for (let y = 0; y < H; y++) {
      const row = (y >> 1) * MW;
      for (let x = 0; x < W; x++) {
        const c = gr[row + (x >> 1)];
        buf[y * W + x] = (c >= 1 && c <= 5) ? pal[(c - 1) * SHADES + 3] : 0;
      }
    }
    const b = o.blob;
    if (b && b.c >= 1 && b.c <= 5) {
      const col = ((pal[(b.c - 1) * SHADES + 5] & 0x00FFFFFF) | 0x99000000) >>> 0;
      for (let y = 0; y < b.h && y < H; y++) for (let x = b.x; x < b.x + b.w && x < W; x++) if (!buf[y * W + x]) buf[y * W + x] = col;
    }
  }
  function specTick() {
    vsTicks++;
    if (vsTicks % 30 === 0) {
      const now = performance.now();
      for (const o of vs.opps) {
        if (!o.dead && !o.gone && now - o.lastRecv > 12000) { o.gone = true; o.place = 0; markDead(o); }
      }
    }
    checkWin();
  }
  function endSpectate(winnerUid) {
    if (vs.ended) return;
    const w = winnerUid ? vs.opps.find(o => o.uid === winnerUid) : aliveOpps()[0];
    if (w) { w.dead = true; w.place = 1; }
    finishVersus(vs.myPlace, vs.myReason);
  }
  $('specPrev').addEventListener('click', () => stepWatch(-1));
  $('specNext').addEventListener('click', () => stepWatch(1));
  $('specLeave').addEventListener('click', () => { if (state === 'spectate') { Sfx.click(); finishVersus(vs.myPlace, vs.myReason); } });

  function finishVersus(place, reason) {
    endSpectUi();
    vs.ended = true;
    state = 'over';
    dragOn = false;
    vs.unsubs.forEach(u => { try { u(); } catch (e) {} });
    vs.unsubs = [];
    vs.on = false;

    const ordinal = n => n + '位';
    $('vsT').textContent = place === 1 ? 'かち!' : ordinal(place);
    $('vsSub').textContent = place === 1 ? '最後まで生き残った!'
      : (reason === 'spill' ? '砂がこぼれすぎました' : '砂があふれました');
    const rows = [{ name: playerName + '(あなた)', place, score, me: true }];
    vs.opps.forEach(o => rows.push({ name: o.name, place: o.dead ? o.place : (o.gone ? 0 : -1), score: o.score }));
    rows.sort((x, y) => (x.place > 0 ? x.place : 99) - (y.place > 0 ? y.place : 99));
    const ol = $('vsRes');
    ol.innerHTML = '';
    rows.forEach(r => {
      const li = document.createElement('li');
      if (r.me) li.className = 'me';
      const n = document.createElement('span'); n.className = 'n'; n.textContent = r.place > 0 ? r.place : '-';
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = r.name + (r.place === 0 ? '(切断)' : (r.place < 0 ? '(プレイ中)' : ''));
      const sc = document.createElement('span'); sc.className = 'sc'; sc.textContent = r.score;
      li.append(n, nm, sc);
      ol.appendChild(li);
    });
    const rm = $('vsRankMsg'), tierEl = $('vsTier');
    if (botMode) {
      const finalScore = score, finalLevel = level;
      const delta = place === 1 ? RANK_WIN : RANK_LOSE;
      rm.textContent = finalScore > 0 ? 'あなたの最高スコアを記録中…' : '';
      tierEl.textContent = 'ランク更新中…';
      applyRankDelta(delta, finalScore, finalLevel).then(r => {
        rp = r.rp; best = Math.max(best, r.best);
        try { localStorage.setItem('sandshake-rp', String(rp)); } catch (e) {}
        try { localStorage.setItem('sandshake-best', String(best)); } catch (e) {}
        const ti = tierInfo(rp);
        const sign = delta >= 0 ? '+' : '';
        const icon = TIER_ICON[ti.name] ? '<img class="badge" alt="" src="' + TIER_ICON[ti.name] + '">' : '';
        tierEl.innerHTML = '<span class="rankline">' + icon + '<span style="color:' + ti.color + '">ランク ' + ti.name + '(RP ' + rp + ', ' + sign + delta + ')</span></span>';
        rm.textContent = finalScore > 0 ? 'あなたの最高 ' + r.best + '点' : '';
      }).catch(e => { tierEl.textContent = 'ランク更新に失敗しました(' + errTag(e) + ')'; });
    } else {
      rm.textContent = ''; tierEl.textContent = '';
    }
    show('vVsOver');
    if (place === 1) Sfx.win(); else Sfx.over();
    try { navigator.vibrate && navigator.vibrate(place === 1 ? [40, 30, 40] : [80, 40, 80]); } catch (e) {}
  }

  // ---- countdown ----
  function countdown() {
    const steps = ['3', '2', '1', 'GO!'];
    let i = 0;
    const step = () => {
      if (!vs.on || state !== 'count') return;
      showPop(steps[i]);
      if (i === 3) Sfx.start(); else Sfx.warn();
      i++;
      if (i < steps.length) setTimeout(step, 800);
      else setTimeout(() => {
        if (vs.on && state === 'count') {
          state = 'play';
          const now = performance.now();
          vs.opps.forEach(o => { o.lastRecv = now; });
        }
      }, 500);
    };
    step();
  }

  function launchVersus(info) {
    stopMatchSearch();
    const { fs, db, uid } = info.fb;
    Object.assign(vs, {
      on: true, ended: false, fs, db, uid, rid: info.rid,
      ref: fs.doc(db, 'rooms', info.rid),
      myRef: fs.doc(db, 'rooms', info.rid, 'states', uid),
      hitsCol: fs.collection(db, 'rooms', info.rid, 'hits'),
      seq: 0, lastSendTick: 0, dirty: false, lastKey: '', dead: false, myPlace: 0, myReason: ''
    });
    vs.seenHits.clear();
    vs.unsubs = [];
    const others = info.uids.map((u, i) => ({ uid: u, name: info.names[i] || 'ゲスト' })).filter(x => x.uid !== uid);
    buildCards(others);
    vs.unsubs.push(fs.onSnapshot(vs.ref, snap => {
      const d = snap.data();
      if (d && d.status === 'finished' && d.winnerUid !== uid && !vs.ended) {
        if (vs.dead) endSpectate(d.winnerUid); else finishVersus(2, 'gone');
      }
    }));
    vs.unsubs.push(fs.onSnapshot(fs.collection(db, 'rooms', info.rid, 'states'), snap => {
      snap.docChanges().forEach(ch => {
        if (ch.type === 'removed' || ch.doc.id === uid) return;
        const o = vs.opps.find(x => x.uid === ch.doc.id);
        if (o) onOppState(o, ch.doc.data());
      });
    }));
    vs.unsubs.push(fs.onSnapshot(fs.query(vs.hitsCol, fs.where('to', '==', uid)), snap => {
      snap.docChanges().forEach(ch => { if (ch.type === 'added') onHit(ch.doc.id, ch.doc.data()); });
    }));
    startGame({ seed: info.seed });
  }

  // ============================================================
  //  Bot opponent ("ランクマッチ"): a self-contained CPU board,
  //  simulated locally (no Firestore) and always instantly available.
  // ============================================================
  const BG = new Uint8Array(N), BSH = new Uint8Array(N), BFL = new Uint8Array(N);
  const botGarbageQ = [0, 0, 0, 0, 0];
  let botScore = 0, botSpilled = 0, botBlocked = 0, botFlip = false;
  let botCombo = 0, botLastClearF = -9999;
  let botCur = null, botNext = null, botCool = 0, botHoldT = 0, botLastColor = 0;
  let botPourColor = -1, botPourX = 0;
  // tilting
  let botThetaT = 0, botTiltTimer = 0;
  let botGX = 0, botGY = 1, botCARD = true, botA1X = 1, botA1Y = 1, botA2X = -1, botA2Y = 1;

  // 0 (Bronze4) .. 1 (Alien): how far up the ladder the player currently is.
  // Even at 0 the bot is already brutal; this only pushes it further.
  function botDifficulty() { return Math.min(1, Math.max(0, rp) / 3000); }
  function botHoldLimit() {
    const d = botDifficulty();
    const base = 4 - Math.floor(d * 2);                           // 4 ticks (d=0, ~0.07s) down to 2 (d=1)
    return Math.max(1, base - Math.floor(vsTicks / 260));         // keeps ramping over a long match
  }
  function botCoolAfterDrop() { return 0; }
  function botSimSteps() { return 9 + (botDifficulty() > 0.5 ? 1 : 0); }
  function botAtkRate() { return 1.8 + botDifficulty() * 0.4; } // 1.8 .. 2.2 (sends far more than it even cleared)

  // extent (min/max x) of a color's cells on the board, or null if it has none
  function botColorExtent(c) {
    let minX = W, maxX = -1;
    for (let x = 0; x < W; x++) {
      for (let y = 0; y < H; y++) {
        if (BG[y * W + x] === c) { if (x < minX) minX = x; if (x > maxX) maxX = x; break; }
      }
    }
    return maxX < 0 ? null : { minX, maxX, gapL: minX, gapR: (W - 1) - maxX };
  }
  function botMakeBlob() {
    const nc = numColors();
    let c = 0;
    // most of the time, keep feeding whichever color is closest to bridging both walls,
    // instead of scattering effort across colors: this is what actually gets clears out.
    if (Math.random() < 0.97) {
      let bestGap = Infinity;
      for (let k = 1; k <= nc; k++) {
        const ex = botColorExtent(k);
        if (!ex) continue;
        const gap = Math.max(ex.gapL, ex.gapR);
        if (gap < bestGap) { bestGap = gap; c = k; }
      }
    }
    if (!c) c = 1 + Math.floor(Math.random() * nc);
    botLastColor = c;
    return { c, w: 10 + Math.floor(Math.random() * 8), h: 5 + Math.floor(Math.random() * 3) };
  }
  function botAreaFree(x0, w, h) {
    if (x0 < 0 || x0 + w > W) return false;
    for (let y = 0; y < h; y++) for (let x = x0; x < x0 + w; x++) if (BG[y * W + x]) return false;
    return true;
  }
  function botAnyFree() {
    const b = botCur;
    for (let x0 = 0; x0 + b.w <= W; x0++) if (botAreaFree(x0, b.w, b.h)) return true;
    return false;
  }
  // choose the landing column that stacks the drop's color onto the most existing same-color sand
  // Instead of just piling the color up, actively grow its footprint toward
  // whichever wall it hasn't reached yet, since a clear needs it to touch BOTH walls.
  function botPlanX(w, h, c) {
    let minX = W, maxX = -1;
    for (let x = 0; x < W; x++) {
      for (let y = 0; y < H; y++) {
        if (BG[y * W + x] === c) { if (x < minX) minX = x; if (x > maxX) maxX = x; break; }
      }
    }
    let target;
    if (maxX < 0) {
      target = Math.random() < 0.5 ? 0 : W - w;                 // nothing yet: seed a wall
    } else {
      const gapL = minX, gapR = (W - 1) - maxX;
      if (gapL > 1 && gapR > 1) target = (gapL <= gapR) ? minX - w + 2 : maxX - 2;
      else if (gapL > 1) target = minX - w + 2;
      else if (gapR > 1) target = maxX - 2;
      else target = (minX + maxX) / 2 - w / 2;                  // already spans both: reinforce middle
    }
    target = Math.max(0, Math.min(W - w, Math.round(target)));
    for (let d = 0; d <= W; d++) {
      if (botAreaFree(target + d, w, h)) return target + d;
      if (d && botAreaFree(target - d, w, h)) return target - d;
    }
    return -1;
  }
  function botTryDrop() {
    const b = botCur;
    const x0 = botPlanX(b.w, b.h, b.c);
    if (x0 < 0) return false;
    for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) {
      if ((y === 0 || y === b.h - 1) && (x === 0 || x === b.w - 1)) continue;
      const i = y * W + x0 + x;
      BG[i] = b.c; BSH[i] = Math.floor(Math.random() * SHADES);
    }
    botCur = botNext; botNext = botMakeBlob();
    return true;
  }

  // ---- tilting: the bot's own board can gravitate in 8 directions, same physics as the player's ----
  function botSetGravity() {
    const rad = botThetaT * Math.PI / 180;
    botGX = Math.round(Math.sin(rad)) | 0;
    botGY = Math.round(Math.cos(rad)) | 0;
    botCARD = (botGX === 0 || botGY === 0);
    if (botCARD) {
      const px = botGY !== 0 ? 1 : 0, py = botGX !== 0 ? 1 : 0;
      botA1X = botGX + px; botA1Y = botGY + py; botA2X = botGX - px; botA2Y = botGY - py;
    } else {
      botA1X = botGX; botA1Y = 0; botA2X = 0; botA2Y = botGY;
    }
  }
  // (the bot stays flat unless the board is getting dangerously full; see botDecideTilt)
  function botFillRatio() {
    let cnt = 0;
    for (let i = 0; i < N; i++) if (BG[i]) cnt++;
    return cnt / N;
  }
  // Above 60% full, the bot starts actively tilting - all the way to sideways (90°) if
  // needed - toward whichever wall the most-progressed color still hasn't reached, both
  // to bridge a clear and to spill the backlog toward more open space. Below 60% it stays flat.
  function botDecideTilt() {
    const receiving = botGarbageQ.some(n => n > 0);              // player's attacks landing right now
    if (!receiving && botFillRatio() <= 0.6) { botThetaT = 0; return; }
    let bestC = 0, bestGap = 0, bestSide = 0;
    if (receiving) {
      // react to the incoming color specifically - that's the immediate threat to clear
      let gc = 0, gbest = 0;
      for (let k = 0; k < 5; k++) if (botGarbageQ[k] > gbest) { gbest = botGarbageQ[k]; gc = k + 1; }
      const ex = botColorExtent(gc);
      if (ex) { const gap = Math.max(ex.gapL, ex.gapR); if (gap > 0) { bestC = gc; bestGap = gap; bestSide = ex.gapL > ex.gapR ? -1 : 1; } }
    }
    if (!bestC) {
      const nc = numColors();
      for (let k = 1; k <= nc; k++) {
        const ex = botColorExtent(k);
        if (!ex) continue;
        const span = ex.maxX - ex.minX + 1;
        if (span < 8) continue;
        const gap = Math.max(ex.gapL, ex.gapR);
        if (gap > bestGap) { bestGap = gap; bestC = k; bestSide = ex.gapL > ex.gapR ? -1 : 1; }
      }
    }
    if (!bestC) { botThetaT = 0; return; }
    botThetaT = bestSide < 0 ? 315 : 45;                         // at most 1 tilt step (45°)
  }
  function botMv(i, x, y, dx, dy) {
    const nx = x + dx, ny = y + dy;
    if (nx < 0 || nx >= W || ny >= H) return false;
    if (ny < 0) { BG[i] = 0; BSH[i] = 0; botSpilled++; return true; }
    const j = ny * W + nx;
    if (BG[j]) return false;
    let t = BG[i]; BG[i] = BG[j]; BG[j] = t;
    t = BSH[i]; BSH[i] = BSH[j]; BSH[j] = t;
    return true;
  }
  function botCell(x, y) {
    const i = y * W + x;
    if (!BG[i] || BFL[i]) return;
    if (botMv(i, x, y, botGX, botGY)) return;
    const first = Math.random() < 0.5;
    for (let t = 0; t < 2; t++) {
      const k = ((t === 0) === first) ? 0 : 1;
      const ax = k ? botA2X : botA1X, ay = k ? botA2Y : botA1Y;
      if (botCARD) {
        const sx = x + ax - botGX, sy = y + ay - botGY;
        if (sx < 0 || sx >= W || sy < 0 || sy >= H || BG[sy * W + sx]) continue;
      }
      if (botMv(i, x, y, ax, ay)) return;
    }
  }
  function botSimStep() {
    botFlip = !botFlip;
    if (botGX !== 0 && botGY === 0) {
      for (let xk = 0; xk < W; xk++) {
        const x = botGX > 0 ? W - 1 - xk : xk;
        for (let yk = 0; yk < H; yk++) botCell(x, botFlip ? yk : H - 1 - yk);
      }
    } else {
      for (let yk = 0; yk < H; yk++) {
        const y = botGY > 0 ? H - 1 - yk : yk;
        for (let xk = 0; xk < W; xk++) {
          const x = botGX > 0 ? W - 1 - xk : (botGX < 0 ? xk : (botFlip ? xk : W - 1 - xk));
          botCell(x, y);
        }
      }
    }
  }
  function botCheckClear() {
    visited.fill(0);
    let cleared = 0;
    const groups = [];
    for (let s = 0; s < N; s++) {
      const c = BG[s];
      if (!c || BFL[s] || visited[s]) continue;
      let sp = 0, n = 0, tL = false, tR = false, tT = false, tB = false;
      stack[sp++] = s; visited[s] = 1;
      while (sp) {
        const i = stack[--sp];
        list[n++] = i;
        const x = i % W, yy = (i / W) | 0;
        if (x === 0) tL = true;
        if (x === W - 1) tR = true;
        if (yy === 0) tT = true;
        if (yy === H - 1) tB = true;
        for (let dy = -1; dy <= 1; dy++) {
          const ny = yy + dy;
          if (ny < 0 || ny >= H) continue;
          for (let dx = -1; dx <= 1; dx++) {
            if (!dx && !dy) continue;
            const nx = x + dx;
            if (nx < 0 || nx >= W) continue;
            const j = ny * W + nx;
            if (!visited[j] && BG[j] === c && !BFL[j]) { visited[j] = 1; stack[sp++] = j; }
          }
        }
      }
      if ((tL && tR) || (tT && tB)) {
        for (let k = 0; k < n; k++) BFL[list[k]] = 22;
        cleared += n;
        groups.push(c, n);
      }
    }
    if (cleared > 0) {
      botScore += cleared;
      // clears that land close together (a chain) hit harder, same idea as the player's own combo
      botCombo = (frameNo - botLastClearF <= 90) ? botCombo + 1 : 0;
      botLastClearF = frameNo;
      const rate = botAtkRate() * (1 + 0.25 * Math.min(botCombo, 6));
      const a = [0, 0, 0, 0, 0];
      let sent = 0;
      for (let q = 0; q < groups.length; q += 2) {
        const amt = Math.floor(groups[q + 1] * rate);
        a[groups[q] - 1] += amt; sent += amt;
      }
      if (sent > 0 && !raceMode) botSendToPlayer(a, botCombo);
      if (botCombo >= 2) showPop(botCombo + '連鎖!');
    }
  }
  function botSendToPlayer(a, combo) {
    for (let k = 0; k < 5; k++) garbageQ[k] = Math.min(600, garbageQ[k] + Math.max(0, a[k] | 0));
    if (combo >= 2) Sfx.chain(combo); else Sfx.incoming();
    updateHUD();
  }
  function botReceiveAttack(a) {
    for (let k = 0; k < 5; k++) botGarbageQ[k] = Math.min(600, botGarbageQ[k] + Math.max(0, a[k] | 0));
    botTiltTimer = 0; // react to incoming sand right away instead of waiting for the next scheduled check
  }
  function botPourTick() {
    if (botGY < 0) return;
    let k = 0;
    while (k < 5 && botGarbageQ[k] <= 0) k++;
    if (k >= 5) { botPourColor = -1; return; }
    if (botPourColor !== k) { botPourColor = k; botPourX = 2 + Math.floor(Math.random() * (W - 9)); }
    let placed = 0;
    for (let a = 0; a < 5 && botGarbageQ[k] > 0; a++) {
      const i = botPourX + a;
      if (!BG[i]) { BG[i] = k + 1; BSH[i] = Math.floor(Math.random() * SHADES); botGarbageQ[k]--; placed++; }
    }
    if (!placed) botPourX = Math.max(0, Math.min(W - 5, botPourX + (Math.random() < 0.5 ? -3 : 3)));
  }
  function botDownsample(dst) {
    for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
      const i = (y * 2) * W + x * 2;
      const cnt = [0, 0, 0, 0, 0, 0];
      cnt[BG[i]]++; cnt[BG[i + 1]]++; cnt[BG[i + W]]++; cnt[BG[i + W + 1]]++;
      let v = 0, best = 0;
      if (4 - cnt[0] >= 2) for (let k = 1; k <= 5; k++) if (cnt[k] > best) { best = cnt[k]; v = k; }
      dst[y * MW + x] = v;
    }
  }
  function botSyncCard() {
    const o = vs.opps[0];
    if (!o) return;
    botDownsample(o.grid);
    o.score = botScore; o.scEl.textContent = botScore; o.spill = botSpilled;
    o.th = botThetaT;
    if (o === specWatch) syncSpecHud();
    drawMini(o);
  }
  function botEliminate() {
    const o = vs.opps[0];
    if (!o || o.dead || o.gone) return;
    o.dead = true; o.place = 2;
    markDead(o);
  }
  function botTick() {
    if (vs.opps[0] && vs.opps[0].dead) return; // frozen (topped out): keep the final score, stop simulating
    if (--botTiltTimer <= 0) {
      botDecideTilt();
      botTiltTimer = botThetaT === 0 ? (40 + Math.floor(Math.random() * 30)) : (20 + Math.floor(Math.random() * 20));
    }
    botSetGravity();
    botPourTick();
    if (botGY >= 0) {
      if (botCool > 0) botCool--;
      else {
        botHoldT++;
        if (botHoldT >= botHoldLimit() && botTryDrop()) { botHoldT = 0; botCool = botCoolAfterDrop(); }
      }
      if (!botAnyFree()) { if (++botBlocked > 90) { botEliminate(); return; } } else botBlocked = 0;
    } else botBlocked = 0;
    if (botSpilled >= SPILL_MAX) { botEliminate(); return; }
    const steps = botSimSteps();
    for (let i = 0; i < steps; i++) botSimStep();
    for (let i = 0; i < N; i++) { if (BFL[i] && --BFL[i] === 0) BG[i] = 0; }
    botCheckClear();
    botSyncCard();
  }
  function resetBot() {
    BG.fill(0); BSH.fill(0); BFL.fill(0);
    botGarbageQ.fill(0);
    botScore = 0; botSpilled = 0; botBlocked = 0; botFlip = false;
    botCool = 0; botHoldT = 0; botLastColor = 0; botPourColor = -1;
    botThetaT = 0; botTiltTimer = 0;
    botCombo = 0; botLastClearF = -9999;
    botCur = botMakeBlob(); botNext = botMakeBlob();
  }
  function startBotMatch() {
    stopMatchSearch();
    botMode = true;
    Object.assign(vs, {
      on: true, ended: false, fs: null, db: null, uid: null, rid: null, ref: null, myRef: null, hitsCol: null,
      dead: false, myPlace: 0, myReason: ''
    });
    vs.seenHits.clear();
    vs.unsubs = [];
    buildCards([{ uid: 'bot', name: BOT_NAME }]);
    resetBot();
    startGame({ seed: 1 + Math.floor(Math.random() * 2147483646) });
  }

  // ============================================================
  //  Matchmaking / lobby
  // ============================================================
  const kwKey = s => 'k:' + [...String(s).normalize('NFKC').trim().toLowerCase()].slice(0, 12).join('');
  const isFresh = d => {
    const hb = d.hostBeat && d.hostBeat.toMillis ? d.hostBeat.toMillis() : 0;
    return Date.now() - hb < 25000;
  };
  async function tryJoin(fb, ref) {
    const { fs, db, uid } = fb;
    try {
      return await fs.runTransaction(db, async tx => {
        const snap = await tx.get(ref);
        if (!snap.exists()) throw new Error('gone');
        const d = snap.data();
        if (d.status !== 'waiting' || d.uids.includes(uid) || d.uids.length >= MAX_PLAYERS) throw new Error('unavailable');
        tx.update(ref, { uids: [...d.uids, uid], names: [...d.names, playerName] });
        return true;
      });
    } catch (e) { return false; }
  }
  async function leaveLobby(fb, ref) {
    const { fs, db, uid } = fb;
    try {
      await fs.runTransaction(db, async tx => {
        const snap = await tx.get(ref);
        if (!snap.exists()) return;
        const d = snap.data();
        if (d.status !== 'waiting' || !d.uids.includes(uid)) return;
        tx.update(ref, {
          uids: d.uids.filter(u => u !== uid),
          names: d.names.filter((n, i) => d.uids[i] !== uid)
        });
      });
    } catch (e) { /* ignore */ }
  }
  function stopMatchSearch() {
    matchToken++;
    if (match) {
      match.timers.forEach(t => clearInterval(t));
      if (match.unsub) { try { match.unsub(); } catch (e) {} }
    }
    match = null;
  }
  async function cancelMatch() {
    const m = match;
    stopMatchSearch();
    if (m && m.ref && m.fb) {
      if (m.isHost) { try { await m.fb.fs.updateDoc(m.ref, { status: 'cancelled' }); } catch (e) {} }
      else await leaveLobby(m.fb, m.ref);
    }
    show('vVs');
  }
  async function hostStart() {
    const m = match;
    if (!m || !m.isHost || m.started || !m.n || m.n < 2) return;
    m.started = true;
    try {
      await m.fb.fs.updateDoc(m.ref, { status: 'playing', seed: 1 + Math.floor(Math.random() * 2147483646) });
    } catch (e) { console.error(e); m.started = false; }
  }

  const LOBBY_COLORS = PAL;
  function renderLobby(m, d) {
    const n = d.uids.length;
    m.n = n;
    const ul = $('lobbyList');
    ul.innerHTML = '';
    for (let k = 0; k < MAX_PLAYERS; k++) {
      const li = document.createElement('li');
      if (k < n) {
        if (d.uids[k] === m.fb.uid) li.className = 'me';
        const dot = document.createElement('i'); dot.style.background = LOBBY_COLORS[k];
        const nm = document.createElement('span'); nm.textContent = d.names[k] || 'ゲスト';
        li.append(dot, nm);
        if (k === 0) { const em = document.createElement('em'); em.textContent = 'ホスト'; li.appendChild(em); }
      } else {
        li.className = 'empty';
        li.textContent = 'あと1人まてます';
      }
      ul.appendChild(li);
    }
    $('lobbyStart').hidden = !(m.isHost && n >= 2);
    let msg;
    if (n < 2) msg = m.kind === 'kw' ? '同じ合言葉を入れた人を待っています…\n(友だちにも同じ合言葉を伝えてね)' : '対戦相手を待っています…';
    else if (n >= MAX_PLAYERS) msg = '4人そろいました!まもなく開始…';
    else if (m.kind === 'kw') msg = m.isHost ? '「いますぐはじめる」で開始できます(最大4人)' : 'ホストが開始するのを待っています…';
    else msg = m.isHost ? '2人以上そろって10秒たつか、4人そろうと開始します…' : 'メンバーがそろうのを待っています(最大4人)…';
    $('waitMsg').textContent = msg;
  }

  function enterLobby(m, ref, isHost, token) {
    const { fs } = m.fb;
    m.ref = ref; m.isHost = isHost; m.started = false; m.n = 0; m.t2 = 0; m.lastSnap = Date.now();
    m.unsub = fs.onSnapshot(ref, snap => {
      if (matchToken !== token) return;
      const d = snap.data();
      if (!d) return;
      m.lastSnap = Date.now();
      if (d.status === 'playing') {
        launchVersus({ fb: m.fb, rid: ref.id, seed: d.seed, uids: d.uids, names: d.names });
        return;
      }
      if (d.status === 'cancelled') {
        // host left: look for another room
        const kind = m.kind;
        stopMatchSearch();
        startMatch(kind);
        return;
      }
      if (d.status === 'waiting') {
        if (isHost && d.uids.length >= 2 && !m.t2) m.t2 = Date.now();
        if (isHost && d.uids.length < 2) m.t2 = 0;
        renderLobby(m, d);
      }
    });
    if (isHost) {
      m.timers.push(setInterval(() => {
        fs.updateDoc(ref, { hostBeat: fs.serverTimestamp() }).catch(() => {});
      }, 5000));
      m.timers.push(setInterval(() => {
        if (matchToken !== token || m.started) return;
        if (m.n >= MAX_PLAYERS) hostStart();
        else if (m.kind === 'random' && m.n >= 2 && m.t2 && Date.now() - m.t2 >= 10000) hostStart();
      }, 500));
      // two players may open rooms at the same time: a lone host joins the room with the smallest id
      let busy = false;
      m.timers.push(setInterval(async () => {
        if (busy || matchToken !== token || m.n !== 1 || m.started) return;
        busy = true;
        try {
          const f = await seekRoom(m.fb, m.key, ref.id);
          if (f && matchToken === token && m.n === 1) {
            const mm = m;
            mm.timers.forEach(t => clearInterval(t)); mm.timers = [];
            if (mm.unsub) { mm.unsub(); mm.unsub = null; }
            fs.updateDoc(ref, { status: 'cancelled' }).catch(() => {});
            enterLobby(mm, f.ref, false, token);
          }
        } catch (e) { /* retry next time */ }
        busy = false;
      }, 2000));
    } else {
      // guest: if the host disappears, go back to searching
      m.timers.push(setInterval(() => {
        if (matchToken !== token) return;
        if (Date.now() - m.lastSnap > 22000) {
          const kind = m.kind;
          leaveLobby(m.fb, ref);
          stopMatchSearch();
          startMatch(kind);
        }
      }, 3000));
    }
  }

  // find a joinable waiting room (joins it and returns { ref } ), optionally only rooms with id < maxId
  async function seekRoom(fb, key, maxId) {
    const { fs, db, uid } = fb;
    const snaps = await fs.getDocs(fs.query(fs.collection(db, 'rooms'),
      fs.where('status', '==', 'waiting'), fs.where('key', '==', key), fs.limit(10)));
    const cands = snaps.docs.filter(d => {
      const x = d.data();
      return Array.isArray(x.uids) && !x.uids.includes(uid) && x.uids.length < MAX_PLAYERS && isFresh(x) && (!maxId || d.id < maxId);
    });
    cands.sort((a, b) => maxId
      ? (a.id < b.id ? -1 : 1)
      : (b.data().uids.length - a.data().uids.length) || (a.id < b.id ? -1 : 1));
    for (const d of cands) {
      if (await tryJoin(fb, d.ref)) return { ref: d.ref };
    }
    return null;
  }

  async function startMatch(kind) {
    let key = 'random', label = 'ランダムマッチ';
    if (kind === 'kw') {
      const raw = $('kwIn').value.normalize('NFKC').trim();
      if (!raw) { $('kwIn').focus(); return; }
      key = kwKey(raw);
      label = '合言葉「' + [...raw].slice(0, 12).join('') + '」';
    }
    stopMatchSearch();
    const token = matchToken;
    const m = match = { kind, key, timers: [], unsub: null, ref: null, fb: null, isHost: false, started: false, n: 0, t2: 0, lastSnap: 0 };
    show('vWait');
    $('waitT').textContent = label;
    $('waitMsg').textContent = 'つなげています…';
    $('lobbyList').innerHTML = '';
    $('lobbyStart').hidden = true;
    try {
      const fb = await ensureFb();
      if (matchToken !== token) return;
      m.fb = fb;
      const { fs, db, uid } = fb;
      $('waitMsg').textContent = '部屋をさがしています…';
      const found = await seekRoom(fb, key, null);
      if (matchToken !== token) { if (found) leaveLobby(fb, found.ref); return; }
      if (found) { enterLobby(m, found.ref, false, token); return; }
      const ref = fs.doc(fs.collection(db, 'rooms'));
      await fs.setDoc(ref, {
        mode: kind, key, status: 'waiting',
        hostUid: uid, uids: [uid], names: [playerName],
        seed: 0, createdAt: fs.serverTimestamp(), hostBeat: fs.serverTimestamp(),
        winnerUid: null, reason: null,
        expireAt: fs.Timestamp.fromMillis(Date.now() + 86400000)
      });
      if (matchToken !== token) { fs.updateDoc(ref, { status: 'cancelled' }).catch(() => {}); return; }
      enterLobby(m, ref, true, token);
    } catch (e) {
      console.error(e);
      if (matchToken === token) $('waitMsg').textContent = 'つながりません。通信と Firebase の設定(匿名認証・Firestore・ルール)を確認してください。';
    }
  }

  // ============================================================
  //  Game
  // ============================================================
  let versus = false, rng = null, pourColor = -1, pourX = 0, vsTicks = 0;
  let botMode = false;
  const garbageQ = [0, 0, 0, 0, 0];
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rnd = () => (versus && rng) ? rng() : Math.random();
  const numColors = () => versus ? 4 : Math.min(5, 1 + level);
  const holdLimit = () => versus
    ? Math.max(240, 540 - Math.floor(vsTicks / 1800) * 30)
    : Math.max(240, 720 - (level - 1) * 90); // ticks (60/sec)

  function swap(i, j) {
    let t = g[i]; g[i] = g[j]; g[j] = t;
    t = sh[i]; sh[i] = sh[j]; sh[j] = t;
  }

  function makeBlob() {
    let c = 1 + Math.floor(rnd() * numColors());
    if (c === lastColor && rnd() < 0.6) c = 1 + Math.floor(rnd() * numColors());
    lastColor = c;
    const w = 8 + Math.floor(rnd() * 7);
    const h = 4 + Math.floor(rnd() * 3);
    return { c, w, h };
  }
  function areaFree(x0) {
    if (x0 < 0 || x0 + cur.w > W) return false;
    for (let y = 0; y < cur.h; y++)
      for (let x = x0; x < x0 + cur.w; x++)
        if (g[y * W + x]) return false;
    return true;
  }
  function findX(x) {
    const r = Math.round(x);
    for (let d = 0; d <= 4; d++) {
      if (areaFree(r + d)) return r + d;
      if (d && areaFree(r - d)) return r - d;
    }
    return -1;
  }
  function anyFree() {
    for (let x0 = 0; x0 + cur.w <= W; x0++) if (areaFree(x0)) return true;
    return false;
  }
  function tryDrop(auto) {
    if (state !== 'play' || cool > 0 || GY < 0 || !cur) return;
    const x0 = findX(dropX);
    if (x0 < 0) {
      if (!auto) { try { navigator.vibrate && navigator.vibrate(20); } catch (e) {} }
      return;
    }
    const b = cur;
    for (let y = 0; y < b.h; y++) {
      for (let x = 0; x < b.w; x++) {
        if ((y === 0 || y === b.h - 1) && (x === 0 || x === b.w - 1)) continue;
        const i = y * W + x0 + x;
        g[i] = b.c;
        sh[i] = Math.floor(Math.random() * SHADES);
      }
    }
    // estimate when the sand reaches the pile, for the landing sound
    let dist = 24;
    if (GY === 1 && GX === 0) {
      let top = H;
      for (let x = x0; x < x0 + b.w; x++) {
        let y = b.h;
        while (y < H && !g[y * W + x]) y++;
        if (y < top) top = y;
      }
      dist = Math.max(0, top - b.h);
    }
    landT = Math.max(3, Math.round(dist / 2));
    landSize = b.w * b.h;
    Sfx.drop();
    cur = nextBlob;
    nextBlob = makeBlob();
    updateChip();
    dropX = Math.max(0, Math.min(W - cur.w, x0 + b.w / 2 - cur.w / 2));
    cool = 22;
    holdT = 0;
  }

  // sand simulation with 8-direction gravity (frame coordinates)
  let CARD = true, A1X = 1, A1Y = 1, A2X = -1, A2Y = 1;
  function mv(i, x, y, dx, dy) {
    const nx = x + dx, ny = y + dy;
    if (nx < 0 || nx >= W || ny >= H) return false;
    if (ny < 0) { g[i] = 0; sh[i] = 0; spilled++; return true; }
    const j = ny * W + nx;
    if (g[j]) return false;
    swap(i, j);
    return true;
  }
  function cell(x, y) {
    const i = y * W + x;
    if (!g[i] || fl[i]) return;
    if (mv(i, x, y, GX, GY)) return;
    const first = Math.random() < 0.5;
    for (let t = 0; t < 2; t++) {
      const k = ((t === 0) === first) ? 0 : 1;
      const ax = k ? A2X : A1X, ay = k ? A2Y : A1Y;
      if (CARD) {
        const sx = x + ax - GX, sy = y + ay - GY;
        if (sx < 0 || sx >= W || sy < 0 || sy >= H || g[sy * W + sx]) continue;
      }
      if (mv(i, x, y, ax, ay)) return;
    }
  }
  function setGravity() {
    const rad = thetaT * Math.PI / 180;
    GX = Math.round(Math.sin(rad)) | 0;
    GY = Math.round(Math.cos(rad)) | 0;
    CARD = (GX === 0 || GY === 0);
    if (CARD) {
      const px = GY !== 0 ? 1 : 0, py = GX !== 0 ? 1 : 0;
      A1X = GX + px; A1Y = GY + py; A2X = GX - px; A2Y = GY - py;
    } else {
      A1X = GX; A1Y = 0; A2X = 0; A2Y = GY;
    }
  }
  function simStep() {
    flip = !flip;
    if (GX !== 0 && GY === 0) {
      for (let xk = 0; xk < W; xk++) {
        const x = GX > 0 ? W - 1 - xk : xk;
        for (let yk = 0; yk < H; yk++) cell(x, flip ? yk : H - 1 - yk);
      }
    } else {
      for (let yk = 0; yk < H; yk++) {
        const y = GY > 0 ? H - 1 - yk : yk;
        for (let xk = 0; xk < W; xk++) {
          const x = GX > 0 ? W - 1 - xk : (GX < 0 ? xk : (flip ? xk : W - 1 - xk));
          cell(x, y);
        }
      }
    }
  }

  // same-color group touching opposite walls (left-right or top-bottom)
  function checkClear() {
    visited.fill(0);
    let cleared = 0;
    const groupsC = [];
    for (let s = 0; s < N; s++) {
      const c = g[s];
      if (!c || fl[s] || visited[s]) continue;
      let sp = 0, n = 0, tL = false, tR = false, tT = false, tB = false;
      stack[sp++] = s; visited[s] = 1;
      while (sp) {
        const i = stack[--sp];
        list[n++] = i;
        const x = i % W, yy = (i / W) | 0;
        if (x === 0) tL = true;
        if (x === W - 1) tR = true;
        if (yy === 0) tT = true;
        if (yy === H - 1) tB = true;
        for (let dy = -1; dy <= 1; dy++) {
          const ny = yy + dy;
          if (ny < 0 || ny >= H) continue;
          for (let dx = -1; dx <= 1; dx++) {
            if (!dx && !dy) continue;
            const nx = x + dx;
            if (nx < 0 || nx >= W) continue;
            const j = ny * W + nx;
            if (!visited[j] && g[j] === c && !fl[j]) { visited[j] = 1; stack[sp++] = j; }
          }
        }
      }
      if ((tL && tR) || (tT && tB)) {
        for (let k = 0; k < n; k++) fl[list[k]] = 22;
        cleared += n;
        groupsC.push(c, n);
      }
    }
    if (cleared > 0) {
      score += cleared;
      combo = (frameNo - lastClearF <= 240) ? combo + 1 : 0;
      lastClearF = frameNo;
      Sfx.clear(cleared, combo);
      if (versus && vs.on && !raceMode) vsAttack(groupsC, combo);
      showPop('+' + cleared);
      try { navigator.vibrate && navigator.vibrate(25); } catch (e) {}
      const nl = 1 + Math.floor(score / 800);
      if (!versus && nl > level) { level = nl; setTimeout(() => showPop('LEVEL ' + level), 700); setTimeout(() => Sfx.level(), 550); }
      updateHUD();
    }
  }

  // moving the dropper: drag sideways (along the frame's top edge), release to drop
  function fingerCellX(e) {
    const r = stage.getBoundingClientRect();
    const vx = e.clientX - (r.left + r.width / 2), vy = e.clientY - (r.top + r.height / 2);
    const rad = theta * Math.PI / 180;
    const u = (vx * Math.cos(rad) + vy * Math.sin(rad)) / K;
    return (u + FW / 2 - 5) / (CELL / DPR);
  }
  stage.addEventListener('pointerdown', e => {
    if (state !== 'play') return;
    dragOn = true; fc0 = fingerCellX(e); dx0 = dropX;
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  });
  stage.addEventListener('pointermove', e => {
    if (!dragOn || state !== 'play' || !cur) return;
    dropX = Math.max(0, Math.min(W - cur.w, dx0 + fingerCellX(e) - fc0));
    const rx = Math.round(dropX);
    if (rx !== lastTickX) { lastTickX = rx; Sfx.move(); }
  });
  stage.addEventListener('pointerup', () => {
    if (!dragOn) return;
    dragOn = false;
    tryDrop(false);
  });
  stage.addEventListener('pointercancel', () => { dragOn = false; });
  $('bL').addEventListener('click', () => { if (state === 'play') { thetaT -= 45; Sfx.tilt(); } });
  $('bR').addEventListener('click', () => { if (state === 'play') { thetaT += 45; Sfx.tilt(); } });

  function updateHUD() {
    $('score').textContent = score;
    $('lv').textContent = versus ? garbageQ.reduce((a, b) => a + b, 0) : level;
    const s = $('spill');
    s.textContent = spilled + '/' + SPILL_MAX;
    s.classList.toggle('warn', spilled > SPILL_MAX * 0.5);
  }
  function updateChip() { $('chip').style.background = PAL[nextBlob.c - 1]; }
  function showPop(t) {
    const p = $('pop');
    p.textContent = t;
    p.classList.remove('show');
    void p.offsetWidth;
    p.classList.add('show');
  }

  function gameOver(spillOut) {
    if (raceMode) { if (!playerFrozen) { playerFrozen = true; Sfx.over(); } return; }
    if (versus) { vsEliminate(spillOut ? 'spill' : 'full'); return; }
    state = 'over';
    dragging = false; dragOn = false;
    Sfx.over();
    const finalScore = score, finalLevel = level;
    const isBest = finalScore > best;
    if (isBest) { best = finalScore; try { localStorage.setItem('sandshake-best', String(best)); } catch (e) {} }
    $('ovT').textContent = spillOut ? 'こぼれた!' : 'あふれた!';
    $('ovScore').textContent = finalScore;
    $('ovBest').textContent = isBest ? '自己ベスト更新!' : 'ベスト ' + best;
    $('ovRank').textContent = '';
    show('vOver');
    try { navigator.vibrate && navigator.vibrate([60, 40, 60]); } catch (e) {}

    if (finalScore > 0) {
      $('ovRank').textContent = 'ランキングに登録中…';
      submitScore(finalScore, finalLevel).then(r => {
        if (state !== 'over') return;
        $('ovRank').textContent = r.rank
          ? 'ランキング ' + r.rank + '位(あなたの最高 ' + r.mine + '点)'
          : 'ランキングに登録しました(あなたの最高 ' + r.mine + '点)';
      }).catch(e => {
        console.error(e);
        if (state === 'over') $('ovRank').textContent = 'ランキングに登録できませんでした(' + errTag(e) + ')';
      });
    } else {
      $('ovRank').textContent = '0点はランキングに載りません';
    }
  }
  function updateRankTimer() {
    const s = Math.max(0, Math.ceil(raceTimeLeft / 60));
    const m = Math.floor(s / 60), ss = s % 60;
    $('rankTimer').textContent = m + ':' + String(ss).padStart(2, '0');
  }
  function startRankMatch() {
    stopMatchSearch();
    botMode = true;
    Object.assign(vs, {
      on: true, ended: false, fs: null, db: null, uid: null, rid: null, ref: null, myRef: null, hitsCol: null,
      dead: false, myPlace: 0, myReason: ''
    });
    vs.seenHits.clear();
    vs.unsubs = [];
    buildCards([{ uid: 'bot', name: BOT_NAME }]);
    resetBot();
    startGame({ seed: 1 + Math.floor(Math.random() * 2147483646) });
    raceMode = true;
    raceTimeLeft = 120 * 60; // 2 minutes at 60 ticks/sec
    $('rankTimerStat').hidden = false;
    updateRankTimer();
  }
  function finishRace() {
    raceMode = false;
    state = 'over';
    dragging = false; dragOn = false;
    $('rankTimerStat').hidden = true;
    const finalScore = score, finalLevel = level;
    const finalBotScore = botScore;
    const win = finalScore > finalBotScore, draw = finalScore === finalBotScore;
    $('vsT').textContent = draw ? 'ひきわけ' : (win ? 'かち!' : 'まけ…');
    $('vsSub').textContent = 'タイムアップ! 2分間のスコアくらべ';
    const rows = [
      { name: playerName + '(あなた)', score: finalScore, me: true },
      { name: BOT_NAME, score: finalBotScore }
    ];
    rows.sort((a, b) => b.score - a.score);
    const ol = $('vsRes');
    ol.innerHTML = '';
    rows.forEach((r, i) => {
      const li = document.createElement('li');
      if (r.me) li.className = 'me';
      const n = document.createElement('span'); n.className = 'n'; n.textContent = (i + 1);
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = r.name;
      const sc = document.createElement('span'); sc.className = 'sc'; sc.textContent = r.score;
      li.append(n, nm, sc);
      ol.appendChild(li);
    });
    const isBest = finalScore > best;
    if (isBest) { best = finalScore; try { localStorage.setItem('sandshake-best', String(best)); } catch (e) {} }
    const rm = $('vsRankMsg'), tierEl = $('vsTier');
    rm.textContent = finalScore > 0 ? (isBest ? 'あなたの自己ベストを更新!' : 'あなたの最高 ' + best + '点') : '';
    tierEl.textContent = 'ランク更新中…';
    show('vVsOver');
    if (win) Sfx.win(); else if (!draw) Sfx.over();
    try { navigator.vibrate && navigator.vibrate(win ? [40, 30, 40] : [80, 40, 80]); } catch (e) {}

    const delta = win ? RANK_WIN : (draw ? 0 : RANK_LOSE);
    applyRankDelta(delta, finalScore, finalLevel).then(r => {
      rp = r.rp; best = Math.max(best, r.best);
      try { localStorage.setItem('sandshake-rp', String(rp)); } catch (e) {}
      try { localStorage.setItem('sandshake-best', String(best)); } catch (e) {}
      const ti = tierInfo(rp);
      const sign = delta >= 0 ? '+' : '';
      const icon = TIER_ICON[ti.name] ? '<img class="badge" alt="" src="' + TIER_ICON[ti.name] + '" style="width:28px;height:28px;vertical-align:-8px;margin-right:4px;">' : '';
      tierEl.innerHTML = icon + 'ランク ' + ti.name + '(RP ' + rp + ', ' + sign + delta + ')';
    }).catch(e => {
      console.error(e);
      tierEl.textContent = 'ランク更新に失敗しました(' + errTag(e) + ')';
    });
  }
  function startGame(opts) {
    endSpectUi();
    raceMode = false; playerFrozen = false;
    $('rankTimerStat').hidden = true;
    rng = opts ? mulberry32(opts.seed) : null;
    garbageQ.fill(0); pourColor = -1; vsTicks = 0;
    setVsUi(!!opts);
    g.fill(0); sh.fill(0); fl.fill(0);
    score = 0; level = 1; spilled = 0; blocked = 0; frameNo = 0; lastColor = 0; cool = 0; holdT = 0;
    landT = 0; combo = 0; lastClearF = -9999;
    theta = thetaT = 0; dragging = false; dragOn = false;
    setGravity();
    cur = makeBlob(); nextBlob = makeBlob();
    dropX = (W - cur.w) / 2;
    updateChip(); updateHUD();
    $('ov').hidden = true;
    state = versus ? 'count' : 'play';
    if (versus) countdown();
  }

  function tick() {
    if (state === 'spectate') { specTick(); return; }
    if (state !== 'play') return;
    setGravity();
    if (versus) { vsTick(); if (state !== 'play') return; }
    if (raceMode) {
      raceTimeLeft--;
      if (raceTimeLeft % 15 === 0) updateRankTimer();
      const botDone = vs.opps[0] && vs.opps[0].dead;
      if (raceTimeLeft <= 0 || (playerFrozen && botDone)) { finishRace(); return; }
      if (playerFrozen) return; // topped out early: board stays frozen, but the clock and CPU keep going
    }
    if (GY >= 0) {
      if (cool > 0) cool--;
      else {
        holdT++;
        const rem = holdLimit() - holdT;
        if (rem > 0 && rem <= 180 && rem % 60 === 0) Sfx.warn();
        if (holdT >= holdLimit()) tryDrop(true);
        if (!anyFree()) { if (++blocked > 90) { gameOver(false); return; } }
        else blocked = 0;
      }
    } else blocked = 0;
    if (landT > 0 && --landT === 0) Sfx.land(landSize);
    const before = spilled;
    simStep();
    simStep();
    for (let i = 0; i < N; i++) {
      if (fl[i] && --fl[i] === 0) g[i] = 0;
    }
    if (spilled !== before) {
      Sfx.spill();
      updateHUD();
      if (spilled >= SPILL_MAX) { gameOver(true); return; }
    }
    frameNo++;
    if (frameNo % 5 === 0) checkClear();
  }

  function applyTransform() {
    const r = theta * Math.PI / 180, c = Math.abs(Math.cos(r)), s = Math.abs(Math.sin(r));
    const bw = FW * c + FH * s, bh = FW * s + FH * c;
    const k = Math.min(1, AW / bw, AH / bh);
    K = k;
    frame.style.transform = 'rotate(' + theta.toFixed(2) + 'deg) scale(' + k.toFixed(4) + ')';
  }

  function render(t) {
    if (state === 'spectate' && specWatch) fillSpectate(specWatch);
    else for (let i = 0; i < N; i++) {
      const c = g[i];
      if (!c) { buf[i] = 0; continue; }
      const f = fl[i];
      buf[i] = (f && ((f >> 1) & 1)) ? WHITE : pal[(c - 1) * SHADES + sh[i]];
    }
    octx.putImageData(img, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(off, 0, 0, cv.width, cv.height);

    const pulse = blocked > 0 ? 0.55 + 0.45 * Math.sin(t * 0.02) : 0.55;
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.strokeStyle = dangerColor;
    ctx.lineWidth = 2 * DPR;
    ctx.setLineDash([8 * DPR, 6 * DPR]);
    ctx.beginPath();
    ctx.moveTo(0, WARN_ROW * CELL);
    ctx.lineTo(cv.width, WARN_ROW * CELL);
    ctx.stroke();
    ctx.restore();

    if (state === 'play' && cur && cool === 0 && GY >= 0) {
      const x0 = Math.round(dropX), col = PAL[cur.c - 1];
      ctx.save();
      if (GY === 1 && GX === 0) { // landing guide
        let top = H;
        for (let x = x0; x < x0 + cur.w; x++) {
          let y = cur.h;
          while (y < H && !g[y * W + x]) y++;
          if (y < top) top = y;
        }
        ctx.globalAlpha = 0.14;
        ctx.fillStyle = col;
        ctx.fillRect(x0 * CELL, cur.h * CELL, cur.w * CELL, Math.max(0, top - cur.h) * CELL);
      }
      ctx.globalAlpha = 0.92; // the sand being held
      ctx.fillStyle = col;
      for (let y = 0; y < cur.h; y++) for (let x = 0; x < cur.w; x++) {
        if ((y === 0 || y === cur.h - 1) && (x === 0 || x === cur.w - 1)) continue;
        ctx.fillRect((x0 + x) * CELL, y * CELL, CELL, CELL);
      }
      ctx.globalAlpha = 0.6;
      ctx.strokeStyle = inkColor;
      ctx.lineWidth = 1.5 * DPR;
      ctx.setLineDash([4 * DPR, 3 * DPR]);
      ctx.strokeRect(x0 * CELL + 0.5, 0.5, cur.w * CELL - 1, cur.h * CELL - 1);
      const ratio = Math.max(0, 1 - holdT / holdLimit()); // time until auto-drop
      ctx.globalAlpha = 1;
      ctx.setLineDash([]);
      ctx.fillStyle = ratio < 0.25 ? dangerColor : col;
      ctx.fillRect(0, 0, cv.width * ratio, 3 * DPR);
      ctx.restore();
    }
  }

  function readTheme() {
    const cs = getComputedStyle(document.documentElement);
    dangerColor = cs.getPropertyValue('--danger').trim() || dangerColor;
    inkColor = cs.getPropertyValue('--ink').trim() || inkColor;
  }

  let last = 0, acc = 0, themeT = 0;
  function loop(t) {
    requestAnimationFrame(loop);
    if (!last) last = t;
    const dt = Math.min(50, t - last);
    last = t;
    acc += dt;
    while (acc >= 16.667) { tick(); acc -= 16.667; }
    if (state === 'spectate' && specWatch) thetaT = specWatch.th;
    if (!dragging) {
      const d = angDelta(theta, thetaT);
      theta = Math.abs(d) < 0.05 ? thetaT : theta + d * Math.min(1, dt * 0.014);
    }
    applyTransform();
    if (!vsBarEl.hidden) vsAnimate(dt);
    if (t - themeT > 500) { readTheme(); themeT = t; }
    render(t);
  }

  function resize() {
    DPR = window.devicePixelRatio || 1;
    AW = stage.clientWidth - 24;
    AH = stage.clientHeight - 16;
    const css = Math.max(1, Math.min((AW - 10) / W, (AH - 5) / H));
    CELL = Math.max(2, Math.floor(css * DPR));
    cv.width = W * CELL;
    cv.height = H * CELL;
    cv.style.width = (W * CELL / DPR) + 'px';
    cv.style.height = (H * CELL / DPR) + 'px';
    FW = W * CELL / DPR + 10;
    FH = H * CELL / DPR + 5;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

  const muteBtn = $('muteBtn');
  const syncMute = () => { muteBtn.classList.toggle('off', Sfx.muted); muteBtn.setAttribute('aria-pressed', String(Sfx.muted)); };
  muteBtn.addEventListener('click', () => {
    Sfx.setMuted(!Sfx.muted);
    syncMute();
    if (!Sfx.muted) Sfx.click();
  });
  syncMute();

  buildTitle();
  buildRules();
  readTheme();
  resize();
  setGravity();
  show('vHome');
  ensureFb().catch(e => console.warn('Firebase init failed:', e)); // sign in anonymously in the background
  requestAnimationFrame(loop);
})();
</script>
