<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAND SHAKE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #e6ebf5;
  --panel: #ffffff;
  --ink: #1c2233;
  --muted: #5d667e;
  --frame: #2a3350;
  --well: #f7f9fe;
  --danger: #e5484d;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10131c; --panel: #1b2033; --ink: #e8ecf7; --muted: #8b94ad;
    --frame: #46527a; --well: #171b29; --danger: #ff6369;
  }
}
:root[data-theme="dark"] {
  --bg: #10131c; --panel: #1b2033; --ink: #e8ecf7; --muted: #8b94ad;
  --frame: #46527a; --well: #171b29; --danger: #ff6369;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--ink);
  font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.hud { flex: none; display: flex; align-items: center; gap: 16px; padding: 10px 16px 2px; }
.stat { display: flex; flex-direction: column; line-height: 1.1; }
.stat span, .next span { font-size: 11px; color: var(--muted); font-weight: 500; }
.stat b { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat b.sm { font-size: 17px; line-height: 1.5; }
.stat b.warn { color: var(--danger); }
.next { display: flex; flex-direction: column; gap: 4px; margin-left: auto; }
.next span { line-height: 1.1; }
.next i { display: block; width: 26px; height: 22px; border-radius: 7px; background: #999; }
#vsBar {
  flex: none;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 10px;
  padding: 2px 12px 0;
}
#vsBar[hidden] { display: none; }
.oppCard { display: flex; flex-direction: column; align-items: center; width: 92px; min-width: 0; }
.miniWrap { position: relative; width: 88px; height: 80px; display: grid; place-items: center; border-radius: 10px; }
.miniFrame {
  border: 3px solid var(--frame);
  border-top: none;
  border-radius: 0 0 8px 8px;
  background: var(--well);
  line-height: 0;
  will-change: transform;
}
.miniCv { display: block; width: 54px; height: 65px; image-rendering: pixelated; }
.deadMark {
  position: absolute; inset: 0; display: none; place-items: center;
  font-family: "DotGothic16", sans-serif; font-size: 40px; line-height: 1; color: var(--danger);
}
.oppCard.dead .deadMark { display: grid; }
.oppCard.dead .miniFrame { opacity: .3; }
.oppCard.hit .miniWrap { animation: hitflash .45s ease-out; }
@keyframes hitflash {
  0% { box-shadow: 0 0 0 0 var(--danger); background: color-mix(in srgb, var(--danger) 35%, transparent); }
  100% { box-shadow: 0 0 0 10px transparent; background: transparent; }
}
@media (prefers-reduced-motion: reduce) { .oppCard.hit .miniWrap { animation: none; background: color-mix(in srgb, var(--danger) 25%, transparent); } }
.pad[hidden] { display: none; }
#specBar {
  position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 3;
  padding: 6px 14px; border-radius: 999px; white-space: nowrap; max-width: calc(100% - 24px);
  overflow: hidden; text-overflow: ellipsis;
  background: var(--panel); border: 2px solid var(--frame);
  font-size: 13px; font-weight: 800; pointer-events: none;
}
#specBar[hidden] { display: none; }
#frame.spec { border-style: dashed; }
body.spec .oppCard:not(.dead) { cursor: pointer; }
.oppCard.watch .miniWrap { outline: 3px solid var(--ink); outline-offset: 1px; }
.oppInfo { display: flex; align-items: baseline; justify-content: center; gap: 5px; max-width: 100%; line-height: 1.2; }
.oppInfo span { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.oppInfo b { font-family: "DotGothic16", sans-serif; font-weight: 400; font-size: 15px; font-variant-numeric: tabular-nums; }
.lobby { list-style: none; margin: 0 0 12px; padding: 0; text-align: left; }
.lobby li { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px; font-size: 15px; }
.lobby li i { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.lobby li em { margin-left: auto; font-style: normal; font-size: 11px; color: var(--muted); }
.lobby li.me { background: color-mix(in srgb, var(--ink) 10%, transparent); font-weight: 800; }
.lobby li.empty { color: var(--muted); border: 2px dashed color-mix(in srgb, var(--frame) 40%, transparent); padding: 5px 8px; }
#vsSub { white-space: pre-line; }
.waitmsg { margin: 4px 0 14px; font-size: 14px; color: var(--muted); line-height: 1.6; min-height: 3.2em; white-space: pre-line; }
.dots { display: flex; justify-content: center; gap: 8px; margin: 0 0 18px; }
.dots i { width: 12px; height: 12px; border-radius: 3px; animation: hop 1s ease-in-out infinite; }
.dots i:nth-child(1) { background: #ef5b5b; }
.dots i:nth-child(2) { background: #f7b733; animation-delay: .15s; }
.dots i:nth-child(3) { background: #1fb5a5; animation-delay: .3s; }
@keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-10px); } }
@media (prefers-reduced-motion: reduce) { .dots i { animation: none; } }
.kwbox { display: flex; gap: 8px; margin: 10px 0 12px; }
.kwbox input {
  flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink);
  background: var(--well); border: 2px solid var(--frame); border-radius: 12px; padding: 10px 12px;
  -webkit-user-select: text; user-select: text;
}
.kwbox input:focus-visible { outline: 3px solid #4a6cf7; outline-offset: 2px; }
.kwbox .btn { width: auto; padding: 10px 14px; font-size: 14px; white-space: nowrap; }
#muteBtn {
  flex: none;
  width: 40px; height: 40px;
  display: grid; place-items: center;
  color: var(--ink);
  background: transparent;
  border: 2px solid var(--frame);
  border-radius: 12px;
  padding: 0;
}
#muteBtn:active { background: var(--frame); color: var(--bg); }
#muteBtn:focus-visible { outline: 3px solid #4a6cf7; outline-offset: 2px; }
#muteBtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
#muteBtn:not(.off) .xmark { display: none; }
#muteBtn.off .waves { display: none; }
#muteBtn.off { opacity: .6; }
#stage {
  flex: 1;
  min-height: 0;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 8px 12px;
  overflow: hidden;
  touch-action: none;
}
#frame {
  position: relative;
  flex: none;
  border: 5px solid var(--frame);
  border-top: none;
  border-radius: 0 0 16px 16px;
  background: var(--well);
  overflow: hidden;
  line-height: 0;
  will-change: transform;
}
#cv { display: block; }
#pop {
  position: absolute;
  left: 50%;
  top: 14%;
  transform: translateX(-50%);
  font-family: "DotGothic16", "M PLUS Rounded 1c", sans-serif;
  font-size: 40px;
  line-height: 1;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  color: var(--ink);
  text-shadow: 0 0 6px var(--bg), 0 0 12px var(--bg), 0 0 18px var(--bg);
  z-index: 4;
}
#pop.show { animation: pop 1000ms ease-out; }
@keyframes pop {
  0% { opacity: 0; transform: translate(-50%, 10px) scale(.8); }
  18% { opacity: 1; transform: translate(-50%, 0) scale(1.1); }
  100% { opacity: 0; transform: translate(-50%, -44px) scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  #pop.show { animation: popfade 1000ms linear; }
  @keyframes popfade { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
}
.pad { flex: none; display: flex; gap: 12px; padding: 4px 16px 12px; }
.pad button {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font: inherit;
  font-weight: 800;
  font-size: 15px;
  color: var(--ink);
  background: transparent;
  border: 2px solid var(--frame);
  border-radius: 16px;
  padding: 14px 10px;
}
.pad button:active { background: var(--frame); color: var(--bg); }
.pad svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

/* overlay + screens */
.ov {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  z-index: 5;
}
.ov[hidden] { display: none; }
.card {
  width: min(100%, 350px);
  max-height: 100%;
  overflow: auto;
  background: var(--panel);
  border: 3px solid var(--frame);
  border-radius: 22px;
  padding: 22px 20px 18px;
  text-align: center;
}
.card[hidden] { display: none; }
.card h2 {
  margin: 0 0 14px;
  font-family: "DotGothic16", "M PLUS Rounded 1c", sans-serif;
  font-weight: 400;
  font-size: 26px;
  letter-spacing: .08em;
  line-height: 1.2;
}
#title { display: block; width: 100%; max-width: 300px; height: auto; margin: 4px auto 14px; overflow: visible; }
.tag { margin: 0 0 6px; font-size: 14px; color: var(--muted); line-height: 1.6; }
.bestline { margin: 0 0 16px; font-family: "DotGothic16", sans-serif; font-size: 15px; min-height: 1.4em; }
.btns { display: flex; flex-direction: column; gap: 10px; }
.btn {
  font: inherit;
  font-weight: 800;
  font-size: 16px;
  color: var(--ink);
  background: transparent;
  border: 2px solid var(--frame);
  border-radius: 14px;
  padding: 13px 20px;
  width: 100%;
}
.btn.primary { color: var(--bg); background: var(--ink); border-color: var(--ink); font-size: 18px; padding: 15px 20px; }
.btn:active { transform: scale(.98); }
.btn:focus-visible, .pad button:focus-visible, #nameIn:focus-visible { outline: 3px solid #4a6cf7; outline-offset: 2px; }
.rules { margin: 0 0 16px; padding: 0; list-style: none; text-align: left; font-size: 14px; line-height: 1.65; }
.rules li { position: relative; padding-left: 22px; margin-bottom: 9px; }
.rules li::before { content: ""; position: absolute; left: 2px; top: .55em; width: 10px; height: 10px; border-radius: 3px; background: var(--c, var(--muted)); }
.score { font-size: 15px; line-height: 1.7; margin: 0 0 8px; color: var(--muted); }
.score b { font-family: "DotGothic16", sans-serif; font-weight: 400; font-size: 48px; color: var(--ink); display: block; line-height: 1.2; font-variant-numeric: tabular-nums; }
.rankmsg { min-height: 1.6em; margin: 0 0 16px; font-size: 14px; color: var(--ink); }
.rank { list-style: none; margin: 0 0 10px; padding: 0; max-height: 36vh; overflow: auto; text-align: left; font-size: 15px; }
.rank li { display: grid; grid-template-columns: 2.6em 1fr auto; gap: 8px; padding: 6px 8px; border-radius: 8px; font-variant-numeric: tabular-nums; }
.rank li.me { background: color-mix(in srgb, var(--ink) 12%, transparent); font-weight: 800; }
.rank .n { font-family: "DotGothic16", sans-serif; color: var(--muted); }
.rank .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .sc { font-family: "DotGothic16", sans-serif; font-size: 17px; }
.rankstate { font-size: 13px; color: var(--muted); min-height: 1.5em; margin: 0 0 8px; line-height: 1.5; }
.namebox { display: flex; gap: 8px; margin: 0 0 12px; }
#nameIn {
  flex: 1;
  min-width: 0;
  font: inherit;
  font-size: 16px;
  color: var(--ink);
  background: var(--well);
  border: 2px solid var(--frame);
  border-radius: 12px;
  padding: 9px 12px;
  -webkit-user-select: text;
  user-select: text;
}
.namebox .btn { width: auto; padding: 9px 16px; font-size: 14px; }
</style>
</head>
<body>
<header class="hud">
  <div class="stat"><span>スコア</span><b id="score">0</b></div>
  <div class="stat"><span id="lvLabel">レベル</span><b id="lv">1</b></div>
  <div class="stat"><span>こぼれ</span><b id="spill" class="sm">0/80</b></div>
  <div class="next"><span>つぎ</span><i id="chip"></i></div>
  <button id="muteBtn" type="button" aria-label="効果音のオン/オフ" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><g class="waves"><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></g><g class="xmark"><path d="M22 9l-6 6"/><path d="M16 9l6 6"/></g></svg>
  </button>
</header>
<div id="vsBar" hidden></div>
<main id="stage">
  <div id="frame"><canvas id="cv"></canvas></div>
  <div id="pop"></div>
  <div id="specBar" hidden></div>

  <div class="ov" id="ov">
    <!-- HOME -->
    <section class="card" id="vHome">
      <svg id="title" role="img" aria-label="SAND SHAKE"></svg>
      <p class="tag">砂を落として、枠を傾けて、同じ色をそろえて消そう</p>
      <p class="bestline" id="homeBest"></p>
      <div class="btns">
        <button class="btn primary" type="button" data-act="start">はじめる</button>
        <button class="btn" type="button" data-act="vs">対戦</button>
        <button class="btn" type="button" data-act="rank">ランキング</button>
        <button class="btn" type="button" data-act="rules">あそびかた</button>
      </div>
    </section>

    <!-- RULES -->
    <section class="card" id="vRules" hidden>
      <h2>あそびかた</h2>
      <ul class="rules" id="rulesList"></ul>
      <button class="btn" type="button" data-act="home">もどる</button>
    </section>

    <!-- RANKING -->
    <section class="card" id="vRank" hidden>
      <h2>ランキング</h2>
      <p class="rankstate" id="rankState"></p>
      <ol class="rank" id="rankList"></ol>
      <div class="namebox">
        <input id="nameIn" type="text" maxlength="10" placeholder="なまえ(10文字まで)" autocomplete="off" aria-label="ニックネーム">
        <button class="btn" type="button" id="nameSave">保存</button>
      </div>
      <button class="btn" type="button" data-act="home">もどる</button>
    </section>

    <!-- GAME OVER -->
    <section class="card" id="vOver" hidden>
      <h2 id="ovT"></h2>
      <p class="score">スコア<b id="ovScore">0</b><span id="ovBest"></span></p>
      <p class="rankmsg" id="ovRank"></p>
      <div class="btns">
        <button class="btn primary" type="button" data-act="start">もういちど</button>
        <button class="btn" type="button" data-act="rank">ランキング</button>
        <button class="btn" type="button" data-act="home">ホーム</button>
      </div>
    </section>

    <!-- VERSUS: choose -->
    <section class="card" id="vVs" hidden>
      <h2>対戦</h2>
      <p class="tag">最大4人で同時にプレイ。自分が消した砂が、ほかの誰かの容器に降りそそぐ。最後まで残った人の勝ち。</p>
      <div class="btns">
        <button class="btn primary" type="button" data-act="vsRandom">ランダムマッチ</button>
      </div>
      <div class="kwbox">
        <input id="kwIn" type="text" maxlength="12" placeholder="合言葉(12文字まで)" autocomplete="off" aria-label="合言葉">
        <button class="btn" type="button" data-act="vsKey">合言葉マッチ</button>
      </div>
      <button class="btn" type="button" data-act="home">もどる</button>
    </section>

    <!-- VERSUS: lobby -->
    <section class="card" id="vWait" hidden>
      <h2 id="waitT">対戦</h2>
      <p class="waitmsg" id="waitMsg"></p>
      <ul class="lobby" id="lobbyList"></ul>
      <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="btns">
        <button class="btn primary" type="button" id="lobbyStart" data-act="lobbyStart" hidden>いますぐはじめる</button>
        <button class="btn" type="button" data-act="cancelWait">やめる</button>
      </div>
    </section>

    <!-- VERSUS: result -->
    <section class="card" id="vVsOver" hidden>
      <h2 id="vsT"></h2>
      <p class="score" id="vsSub"></p>
      <ol class="rank" id="vsRes"></ol>
      <div class="btns">
        <button class="btn primary" type="button" data-act="vs">もういちど対戦</button>
        <button class="btn" type="button" data-act="home">ホーム</button>
      </div>
    </section>
  </div>
</main>
<div class="pad" id="pad">
  <button id="bL" type="button" aria-label="左に傾ける">
    <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>ひだりに傾ける
  </button>
  <button id="bR" type="button" aria-label="右に傾ける">
    みぎに傾ける<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
  </button>
</div>
<div class="pad" id="specPad" hidden>
  <button id="specPrev" type="button">◀ 前の人</button>
  <button id="specLeave" type="button">観戦をやめる</button>
  <button id="specNext" type="button">次の人 ▶</button>
</div>

<script>
// ============================================================
//  Firebase (anonymous auth + Firestore ranking)
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyC2y2yyzcHr5Lfh1CPhOI8ABDASmy0v1e4",
  authDomain: "sand-shake.firebaseapp.com",
  projectId: "sand-shake",
  storageBucket: "sand-shake.firebasestorage.app",
  messagingSenderId: "903859599063",
  appId: "1:903859599063:web:0a1ad317f217f0bb25a292",
  measurementId: "G-V8FNFSXP8H"
};
const FB_VER = '10.12.2';
const FB_BASE = 'https://www.gstatic.com/firebasejs/' + FB_VER + '/';

// ============================================================
//  Sound effects (Web Audio, synthesized: no audio files)
// ============================================================
const Sfx = (() => {
  let ac = null, master = null, noiseBuf = null, muted = false;
  try { muted = localStorage.getItem('sandshake-mute') === '1'; } catch (e) {}
  const last = {};
  const throttle = (k, ms) => { const n = performance.now(); if (last[k] && n - last[k] < ms) return false; last[k] = n; return true; };

  function init() {
    try {
      if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = muted ? 0 : 0.8;
      const comp = ac.createDynamicsCompressor();
      master.connect(comp); comp.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 1.5, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
  }
  const ok = () => ac && !muted && ac.state !== 'closed';

  function env(g, t0, att, dur, vol) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + att);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  }
  function tone(f, dur, o = {}) {
    if (!ok()) return;
    const t0 = ac.currentTime + (o.delay || 0);
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
    env(g, t0, o.att || 0.006, dur, o.vol == null ? 0.2 : o.vol);
    osc.connect(g); g.connect(master);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  }
  function noise(dur, o = {}) {
    if (!ok()) return;
    const t0 = ac.currentTime + (o.delay || 0);
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf;
    f.type = o.type || 'bandpass';
    f.Q.value = o.q || 1;
    f.frequency.setValueAtTime(o.f0 || 1000, t0);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t0 + dur);
    env(g, t0, o.att || 0.01, dur, o.vol == null ? 0.1 : o.vol);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0, Math.random() * 0.3); src.stop(t0 + dur + 0.05);
  }

  const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26];
  const hz = (base, semis) => base * Math.pow(2, semis / 12);

  return {
    init,
    get muted() { return muted; },
    setMuted(m) {
      muted = m;
      try { localStorage.setItem('sandshake-mute', m ? '1' : '0'); } catch (e) {}
      if (master) master.gain.value = m ? 0 : 0.8;
    },
    click() { tone(660, 0.05, { type: 'triangle', to: 880, vol: 0.1 }); },

    o.spill = d.sp | 0;
    if (o === specWatch) syncSpecHud();
    if (d.dead === true && !o.dead) { o.dead = true; o.place = d.place | 0; markDead(o); checkWin(); return; }
    drawMini(o);
  }
  function onHit(id, d) {
    if (vs.dead || vs.seenHits.has(id)) return;
    vs.seenHits.add(id);
    let got = 0;
    if (Array.isArray(d.a)) for (let k = 0; k < 5; k++) {
      const n = Math.max(0, d.a[k] | 0);
      if (n > 0) { garbageQ[k] = Math.min(600, garbageQ[k] + n); got += n; }
    }
    if (got > 0) { Sfx.incoming(); updateHUD(); }
  }

  // attack: cleared sand goes to a random surviving opponent
  function vsAttack(groups, combo) {
    const alive = vs.opps.filter(o => !o.dead && !o.gone);
    if (!alive.length) return;
    const mult = 1 + 0.2 * Math.min(combo, 5);
    const a = [0, 0, 0, 0, 0];
    let sent = 0;
    for (let q = 0; q < groups.length; q += 2) {
      const amt = Math.floor(groups[q + 1] * ATK_RATE * mult);
      a[groups[q] - 1] += amt; sent += amt;
    }
    if (sent <= 0) return;
    const t = alive[Math.floor(Math.random() * alive.length)];
    vs.fs.addDoc(vs.hitsCol, { from: vs.uid, to: t.uid, a, expireAt: expireAt() }).catch(e => console.warn('hit failed', e));
    Sfx.send();
    t.card.classList.remove('hit'); void t.card.offsetWidth; t.card.classList.add('hit');
    setTimeout(() => t.card.classList.remove('hit'), 500);
  }

  // garbage: received sand pours in from the top as a stream
  function pourTick() {
    if (GY < 0) return;
    let k = 0;
    while (k < 5 && garbageQ[k] <= 0) k++;
    if (k >= 5) { pourColor = -1; return; }
    if (pourColor !== k) { pourColor = k; pourX = 2 + Math.floor(Math.random() * (W - 9)); }
    let placed = 0;
    for (let a = 0; a < 5 && garbageQ[k] > 0; a++) {
      const i = pourX + a;
      if (!g[i]) { g[i] = k + 1; sh[i] = Math.floor(Math.random() * SHADES); garbageQ[k]--; placed++; }
    }
    if (!placed) pourX = Math.max(0, Math.min(W - 5, pourX + (Math.random() < 0.5 ? -3 : 3)));
    else if (frameNo % 6 === 0) updateHUD();
    if (garbageQ.every(n => n <= 0)) updateHUD();
  }
  function vsTick() {
    vsTicks++;
    pourTick();
    const since = vsTicks - vs.lastSendTick;
    if (since >= 60 || (vs.dirty && since >= 20)) vsSend();
    if (vsTicks > 300 && vsTicks % 30 === 0) {
      const now = performance.now();
      for (const o of vs.opps) {
        if (!o.dead && !o.gone && now - o.lastRecv > 12000) { o.gone = true; o.place = 0; markDead(o); }
      }
    }
    checkWin();
  }

  // ---- elimination / victory ----
  const aliveCount = () => 1 + vs.opps.filter(o => !o.dead && !o.gone).length;
  const aliveOpps = () => vs.opps.filter(o => !o.dead && !o.gone);
  function checkWin() {
    if (!vs.on || vs.ended) return;
    if (state === 'spectate') { if (aliveOpps().length <= 1) endSpectate(); return; }
    if (state !== 'play') return;
    if (vs.opps.every(o => o.dead || o.gone)) vsWin();
  }
  function vsEliminate(reason) {
    if (!vs.on || vs.ended || vs.dead) return;
    const place = aliveCount();
    vs.fs.setDoc(vs.myRef, stateData(true, place)).catch(() => {});
    vs.dead = true; vs.myPlace = place; vs.myReason = reason;
    if (place >= 3) startSpectate();      // others are still fighting: watch them
    else finishVersus(place, reason);
  }
  function vsWin() {
    if (!vs.on || vs.ended) return;
    vs.fs.updateDoc(vs.ref, { status: 'finished', winnerUid: vs.uid, reason: 'last' }).catch(() => {});
    finishVersus(1, 'last');
  }

  // ---- spectating (after being eliminated while the match goes on) ----
  function startSpectate() {
    state = 'spectate';
    dragOn = false;
    document.body.classList.add('spec');
    frame.classList.add('spec');
    $('pad').hidden = true;
    $('specPad').hidden = false;
    $('lv').textContent = '-';
    pickWatch();
    Sfx.over();
    try { navigator.vibrate && navigator.vibrate([80, 40, 80]); } catch (e) {}
  }
  function pickWatch() {
    const a = aliveOpps();
    if (!a.length) { specWatch = null; return; }
    setWatch(a.includes(specWatch) ? specWatch : a[0]);
  }
  function setWatch(o) {
    specWatch = o;
    vs.opps.forEach(x => x.card.classList.toggle('watch', x === o));
    const b = $('specBar');
    b.hidden = false;
    b.textContent = '脱落 ' + vs.myPlace + '位 ・ 観戦中: ' + o.name;
    syncSpecHud();
  }
  function syncSpecHud() {
    const o = specWatch;
    if (!o) return;
    $('score').textContent = o.score;
    const sp = $('spill');
    sp.textContent = o.spill + '/' + SPILL_MAX;
    sp.classList.toggle('warn', o.spill > SPILL_MAX * 0.5);
    $('chip').style.background = (o.blob && o.blob.c >= 1 && o.blob.c <= 5) ? PAL[o.blob.c - 1] : '#999';
  }
  function stepWatch(dir) {
    const a = aliveOpps();
    if (!a.length) return;
    let i = a.indexOf(specWatch);
    i = (i + dir + a.length) % a.length;
    setWatch(a[i]);
    Sfx.click();
  }
  function endSpectUi() {
    specWatch = null;
    document.body.classList.remove('spec');
    frame.classList.remove('spec');
    $('pad').hidden = false;
    $('specPad').hidden = true;
    $('specBar').hidden = true;
    vs.opps.forEach(x => x.card.classList.remove('watch'));
  }
  // paint the watched player's (downsampled) board into the main frame
  function fillSpectate(o) {
    const gr = o.grid;
    for (let y = 0; y < H; y++) {
      const row = (y >> 1) * MW;
      for (let x = 0; x < W; x++) {
        const c = gr[row + (x >> 1)];
        buf[y * W + x] = (c >= 1 && c <= 5) ? pal[(c - 1) * SHADES + 3] : 0;
      }
    }
    const b = o.blob;
    if (b && b.c >= 1 && b.c <= 5) {
      const col = ((pal[(b.c - 1) * SHADES + 5] & 0x00FFFFFF) | 0x99000000) >>> 0;
      for (let y = 0; y < b.h && y < H; y++) for (let x = b.x; x < b.x + b.w && x < W; x++) if (!buf[y * W + x]) buf[y * W + x] = col;
    }
  }
  function specTick() {
    vsTicks++;
    if (vsTicks % 30 === 0) {
      const now = performance.now();
      for (const o of vs.opps) {
        if (!o.dead && !o.gone && now - o.lastRecv > 12000) { o.gone = true; o.place = 0; markDead(o); }
      }
    }
    checkWin();
  }
  function endSpectate(winnerUid) {
    if (vs.ended) return;
    const w = winnerUid ? vs.opps.find(o => o.uid === winnerUid) : aliveOpps()[0];
    if (w) { w.dead = true; w.place = 1; }
    finishVersus(vs.myPlace, vs.myReason);
  }
  $('specPrev').addEventListener('click', () => stepWatch(-1));
  $('specNext').addEventListener('click', () => stepWatch(1));
  $('specLeave').addEventListener('click', () => { if (state === 'spectate') { Sfx.click(); finishVersus(vs.myPlace, vs.myReason); } });

  function finishVersus(place, reason) {
    endSpectUi();
    vs.ended = true;
    state = 'over';
    dragOn = false;
    vs.unsubs.forEach(u => { try { u(); } catch (e) {} });
    vs.unsubs = [];
    vs.on = false;

    const ordinal = n => n + '位';
    $('vsT').textContent = place === 1 ? 'かち!' : ordinal(place);
    $('vsSub').textContent = place === 1 ? '最後まで生き残った!'
      : (reason === 'spill' ? '砂がこぼれすぎました' : '砂があふれました');
    const rows = [{ name: playerName + '(あなた)', place, score, me: true }];
    vs.opps.forEach(o => rows.push({ name: o.name, place: o.dead ? o.place : (o.gone ? 0 : -1), score: o.score }));
    rows.sort((x, y) => (x.place > 0 ? x.place : 99) - (y.place > 0 ? y.place : 99));
    const ol = $('vsRes');
    ol.innerHTML = '';
    rows.forEach(r => {
      const li = document.createElement('li');
      if (r.me) li.className = 'me';
      const n = document.createElement('span'); n.className = 'n'; n.textContent = r.place > 0 ? r.place : '-';
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = r.name + (r.place === 0 ? '(切断)' : (r.place < 0 ? '(プレイ中)' : ''));
      const sc = document.createElement('span'); sc.className = 'sc'; sc.textContent = r.score;
      li.append(n, nm, sc);
      ol.appendChild(li);
    });
    show('vVsOver');
    if (place === 1) Sfx.win(); else Sfx.over();
    try { navigator.vibrate && navigator.vibrate(place === 1 ? [40, 30, 40] : [80, 40, 80]); } catch (e) {}
  }

  // ---- countdown ----
  function countdown() {
    const steps = ['3', '2', '1', 'GO!'];
    let i = 0;
    const step = () => {
      if (!vs.on || state !== 'count') return;
      showPop(steps[i]);
      if (i === 3) Sfx.start(); else Sfx.warn();
      i++;
      if (i < steps.length) setTimeout(step, 800);
      else setTimeout(() => {
        if (vs.on && state === 'count') {
          state = 'play';
          const now = performance.now();
          vs.opps.forEach(o => { o.lastRecv = now; });
        }
      }, 500);
    };
    step();
  }

  function launchVersus(info) {
    stopMatchSearch();
    const { fs, db, uid } = info.fb;
    Object.assign(vs, {
      on: true, ended: false, fs, db, uid, rid: info.rid,
      ref: fs.doc(db, 'rooms', info.rid),
      myRef: fs.doc(db, 'rooms', info.rid, 'states', uid),
      hitsCol: fs.collection(db, 'rooms', info.rid, 'hits'),
      seq: 0, lastSendTick: 0, dirty: false, lastKey: '', dead: false, myPlace: 0, myReason: ''
    });
    vs.seenHits.clear();
    vs.unsubs = [];
    const others = info.uids.map((u, i) => ({ uid: u, name: info.names[i] || 'ゲスト' })).filter(x => x.uid !== uid);
    buildCards(others);
    vs.unsubs.push(fs.onSnapshot(vs.ref, snap => {
      const d = snap.data();
      if (d && d.status === 'finished' && d.winnerUid !== uid && !vs.ended) {
        if (vs.dead) endSpectate(d.winnerUid); else finishVersus(2, 'gone');
      }
    }));
    vs.unsubs.push(fs.onSnapshot(fs.collection(db, 'rooms', info.rid, 'states'), snap => {
      snap.docChanges().forEach(ch => {
        if (ch.type === 'removed' || ch.doc.id === uid) return;
        const o = vs.opps.find(x => x.uid === ch.doc.id);
        if (o) onOppState(o, ch.doc.data());
      });
    }));
    vs.unsubs.push(fs.onSnapshot(fs.query(vs.hitsCol, fs.where('to', '==', uid)), snap => {
      snap.docChanges().forEach(ch => { if (ch.type === 'added') onHit(ch.doc.id, ch.doc.data()); });
    }));
    startGame({ seed: info.seed });
  }

  // ============================================================
  //  Matchmaking / lobby
  // ============================================================
  const kwKey = s => 'k:' + [...String(s).normalize('NFKC').trim().toLowerCase()].slice(0, 12).join('');
  const isFresh = d => {
    const hb = d.hostBeat && d.hostBeat.toMillis ? d.hostBeat.toMillis() : 0;
    return Date.now() - hb < 25000;
  };
  async function tryJoin(fb, ref) {
    const { fs, db, uid } = fb;
    try {
      return await fs.runTransaction(db, async tx => {
        const snap = await tx.get(ref);
        if (!snap.exists()) throw new Error('gone');
        const d = snap.data();
        if (d.status !== 'waiting' || d.uids.includes(uid) || d.uids.length >= MAX_PLAYERS) throw new Error('unavailable');
        tx.update(ref, { uids: [...d.uids, uid], names: [...d.names, playerName] });
        return true;
      });
    } catch (e) { return false; }
  }
  async function leaveLobby(fb, ref) {
    const { fs, db, uid } = fb;
    try {
      await fs.runTransaction(db, async tx => {
        const snap = await tx.get(ref);
        if (!snap.exists()) return;
        const d = snap.data();
        if (d.status !== 'waiting' || !d.uids.includes(uid)) return;
        tx.update(ref, {
          uids: d.uids.filter(u => u !== uid),
          names: d.names.filter((n, i) => d.uids[i] !== uid)
        });
      });
    } catch (e) { /* ignore */ }
  }
  function stopMatchSearch() {
    matchToken++;
    if (match) {
      match.timers.forEach(t => clearInterval(t));
      if (match.unsub) { try { match.unsub(); } catch (e) {} }
    }
    match = null;
  }
  async function cancelMatch() {
    const m = match;
    stopMatchSearch();
    if (m && m.ref && m.fb) {
      if (m.isHost) { try { await m.fb.fs.updateDoc(m.ref, { status: 'cancelled' }); } catch (e) {} }
      else await leaveLobby(m.fb, m.ref);
    }
    show('vVs');
  }
  async function hostStart() {
    const m = match;
    if (!m || !m.isHost || m.started || !m.n || m.n < 2) return;
    m.started = true;
    try {
      await m.fb.fs.updateDoc(m.ref, { status: 'playing', seed: 1 + Math.floor(Math.random() * 2147483646) });
    } catch (e) { console.error(e); m.started = false; }
  }

  const LOBBY_COLORS = ['#ef5b5b', '#f7b733', '#1fb5a5', '#4a6cf7'];
  function renderLobby(m, d) {
    const n = d.uids.length;
    m.n = n;
    const ul = $('lobbyList');
    ul.innerHTML = '';
    for (let k = 0; k < MAX_PLAYERS; k++) {
      const li = document.createElement('li');
      if (k < n) {
        if (d.uids[k] === m.fb.uid) li.className = 'me';
        const dot = document.createElement('i'); dot.style.background = LOBBY_COLORS[k];
        const nm = document.createElement('span'); nm.textContent = d.names[k] || 'ゲスト';
        li.append(dot, nm);
        if (k === 0) { const em = document.createElement('em'); em.textContent = 'ホスト'; li.appendChild(em); }
      } else {
        li.className = 'empty';
        li.textContent = 'あと1人まてます';
      }
      ul.appendChild(li);
    }
    $('lobbyStart').hidden = !(m.isHost && n >= 2);
    let msg;
    if (n < 2) msg = m.kind === 'kw' ? '同じ合言葉を入れた人を待っています…\n(友だちにも同じ合言葉を伝えてね)' : '対戦相手を待っています…';
    else if (n >= MAX_PLAYERS) msg = '4人そろいました!まもなく開始…';
    else if (m.kind === 'kw') msg = m.isHost ? '「いますぐはじめる」で開始できます(最大4人)' : 'ホストが開始するのを待っています…';
    else msg = m.isHost ? '2人以上そろって10秒たつか、4人そろうと開始します…' : 'メンバーがそろうのを待っています(最大4人)…';
    $('waitMsg').textContent = msg;
  }

  function enterLobby(m, ref, isHost, token) {
    const { fs } = m.fb;
    m.ref = ref; m.isHost = isHost; m.started = false; m.n = 0; m.t2 = 0; m.lastSnap = Date.now();
    m.unsub = fs.onSnapshot(ref, snap => {
      if (matchToken !== token) return;
      const d = snap.data();
      if (!d) return;
      m.lastSnap = Date.now();
      if (d.status === 'playing') {
        launchVersus({ fb: m.fb, rid: ref.id, seed: d.seed, uids: d.uids, names: d.names });
        return;
      }
      if (d.status === 'cancelled') {
        // host left: look for another room
        const kind = m.kind;
        stopMatchSearch();
        startMatch(kind);
        return;
      }
      if (d.status === 'waiting') {
        if (isHost && d.uids.length >= 2 && !m.t2) m.t2 = Date.now();
        if (isHost && d.uids.length < 2) m.t2 = 0;
        renderLobby(m, d);
      }
    });
    if (isHost) {
      m.timers.push(setInterval(() => {
        fs.updateDoc(ref, { hostBeat: fs.serverTimestamp() }).catch(() => {});
      }, 5000));
      m.timers.push(setInterval(() => {
        if (matchToken !== token || m.started) return;
        if (m.n >= MAX_PLAYERS) hostStart();
        else if (m.kind === 'random' && m.n >= 2 && m.t2 && Date.now() - m.t2 >= 10000) hostStart();
      }, 500));
      // two players may open rooms at the same time: a lone host joins the room with the smallest id
      let busy = false;
      m.timers.push(setInterval(async () => {
        if (busy || matchToken !== token || m.n !== 1 || m.started) return;
        busy = true;
        try {
          const f = await seekRoom(m.fb, m.key, ref.id);
          if (f && matchToken === token && m.n === 1) {
            const mm = m;
            mm.timers.forEach(t => clearInterval(t)); mm.timers = [];
            if (mm.unsub) { mm.unsub(); mm.unsub = null; }
            fs.updateDoc(ref, { status: 'cancelled' }).catch(() => {});
            enterLobby(mm, f.ref, false, token);
          }
        } catch (e) { /* retry next time */ }
        busy = false;
      }, 2000));
    } else {
      // guest: if the host disappears, go back to searching
      m.timers.push(setInterval(() => {
        if (matchToken !== token) return;
        if (Date.now() - m.lastSnap > 22000) {
          const kind = m.kind;
          leaveLobby(m.fb, ref);
          stopMatchSearch();
          startMatch(kind);
        }
      }, 3000));
    }
  }

  // find a joinable waiting room (joins it and returns { ref } ), optionally only rooms with id < maxId
  async function seekRoom(fb, key, maxId) {
    const { fs, db, uid } = fb;
    const snaps = await fs.getDocs(fs.query(fs.collection(db, 'rooms'),
      fs.where('status', '==', 'waiting'), fs.where('key', '==', key), fs.limit(10)));
    const cands = snaps.docs.filter(d => {
      const x = d.data();
      return Array.isArray(x.uids) && !x.uids.includes(uid) && x.uids.length < MAX_PLAYERS && isFresh(x) && (!maxId || d.id < maxId);
    });
    cands.sort((a, b) => maxId
      ? (a.id < b.id ? -1 : 1)
      : (b.data().uids.length - a.data().uids.length) || (a.id < b.id ? -1 : 1));
    for (const d of cands) {
      if (await tryJoin(fb, d.ref)) return { ref: d.ref };
    }
    return null;
  }

  async function startMatch(kind) {
    let key = 'random', label = 'ランダムマッチ';
    if (kind === 'kw') {
      const raw = $('kwIn').value.normalize('NFKC').trim();
      if (!raw) { $('kwIn').focus(); return; }
      key = kwKey(raw);
      label = '合言葉「' + [...raw].slice(0, 12).join('') + '」';
    }
    stopMatchSearch();
    const token = matchToken;
    const m = match = { kind, key, timers: [], unsub: null, ref: null, fb: null, isHost: false, started: false, n: 0, t2: 0, lastSnap: 0 };
    show('vWait');
    $('waitT').textContent = label;
    $('waitMsg').textContent = 'つなげています…';
    $('lobbyList').innerHTML = '';
    $('lobbyStart').hidden = true;
    try {
      const fb = await ensureFb();
      if (matchToken !== token) return;
      m.fb = fb;
      const { fs, db, uid } = fb;
      $('waitMsg').textContent = '部屋をさがしています…';
      const found = await seekRoom(fb, key, null);
      if (matchToken !== token) { if (found) leaveLobby(fb, found.ref); return; }
      if (found) { enterLobby(m, found.ref, false, token); return; }
      const ref = fs.doc(fs.collection(db, 'rooms'));
      await fs.setDoc(ref, {
        mode: kind, key, status: 'waiting',
        hostUid: uid, uids: [uid], names: [playerName],
        seed: 0, createdAt: fs.serverTimestamp(), hostBeat: fs.serverTimestamp(),
        winnerUid: null, reason: null,
        expireAt: fs.Timestamp.fromMillis(Date.now() + 86400000)
      });
      if (matchToken !== token) { fs.updateDoc(ref, { status: 'cancelled' }).catch(() => {}); return; }
      enterLobby(m, ref, true, token);
    } catch (e) {
      console.error(e);
      if (matchToken === token) $('waitMsg').textContent = 'つながりません。通信と Firebase の設定(匿名認証・Firestore・ルール)を確認してください。';
    }
  }

  // ============================================================
  //  Game
  // ============================================================
  let versus = false, rng = null, pourColor = -1, pourX = 0, vsTicks = 0;
  const garbageQ = [0, 0, 0, 0, 0];
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rnd = () => (versus && rng) ? rng() : Math.random();
  const numColors = () => versus ? 4 : Math.min(5, 1 + level);
  const holdLimit = () => versus
    ? Math.max(240, 540 - Math.floor(vsTicks / 1800) * 30)
    : Math.max(240, 720 - (level - 1) * 90); // ticks (60/sec)

  function swap(i, j) {
    let t = g[i]; g[i] = g[j]; g[j] = t;
    t = sh[i]; sh[i] = sh[j]; sh[j] = t;
  }

  function makeBlob() {
    let c = 1 + Math.floor(rnd() * numColors());
    if (c === lastColor && rnd() < 0.6) c = 1 + Math.floor(rnd() * numColors());
    lastColor = c;
    const w = 8 + Math.floor(rnd() * 7);
    const h = 4 + Math.floor(rnd() * 3);
    return { c, w, h };
  }
  function areaFree(x0) {
    if (x0 < 0 || x0 + cur.w > W) return false;
    for (let y = 0; y < cur.h; y++)
      for (let x = x0; x < x0 + cur.w; x++)
        if (g[y * W + x]) return false;
    return true;
  }
  function findX(x) {
    const r = Math.round(x);
    for (let d = 0; d <= 4; d++) {
      if (areaFree(r + d)) return r + d;
      if (d && areaFree(r - d)) return r - d;
    }
    return -1;
  }
  function anyFree() {
    for (let x0 = 0; x0 + cur.w <= W; x0++) if (areaFree(x0)) return true;
    return false;
  }
  function tryDrop(auto) {
    if (state !== 'play' || cool > 0 || GY < 0 || !cur) return;
    const x0 = findX(dropX);
    if (x0 < 0) {
      if (!auto) { try { navigator.vibrate && navigator.vibrate(20); } catch (e) {} }
      return;
    }
    const b = cur;
    for (let y = 0; y < b.h; y++) {
      for (let x = 0; x < b.w; x++) {
        if ((y === 0 || y === b.h - 1) && (x === 0 || x === b.w - 1)) continue;
        const i = y * W + x0 + x;
        g[i] = b.c;
        sh[i] = Math.floor(Math.random() * SHADES);
      }
    }
    // estimate when the sand reaches the pile, for the landing sound
    let dist = 24;
    if (GY === 1 && GX === 0) {
      let top = H;
      for (let x = x0; x < x0 + b.w; x++) {
        let y = b.h;
        while (y < H && !g[y * W + x]) y++;
        if (y < top) top = y;
      }
      dist = Math.max(0, top - b.h);
    }
    landT = Math.max(3, Math.round(dist / 2));
    landSize = b.w * b.h;
    Sfx.drop();
    cur = nextBlob;
    nextBlob = makeBlob();
    updateChip();
    dropX = Math.max(0, Math.min(W - cur.w, x0 + b.w / 2 - cur.w / 2));
    cool = 22;
    holdT = 0;
  }

  // sand simulation with 8-direction gravity (frame coordinates)
  let CARD = true, A1X = 1, A1Y = 1, A2X = -1, A2Y = 1;
  function mv(i, x, y, dx, dy) {
    const nx = x + dx, ny = y + dy;
    if (nx < 0 || nx >= W || ny >= H) return false;
    if (ny < 0) { g[i] = 0; sh[i] = 0; spilled++; return true; }
    const j = ny * W + nx;
    if (g[j]) return false;
    swap(i, j);
    return true;
  }
  function cell(x, y) {
    const i = y * W + x;
    if (!g[i] || fl[i]) return;
    if (mv(i, x, y, GX, GY)) return;
    const first = Math.random() < 0.5;
    for (let t = 0; t < 2; t++) {
      const k = ((t === 0) === first) ? 0 : 1;
      const ax = k ? A2X : A1X, ay = k ? A2Y : A1Y;
      if (CARD) {
        const sx = x + ax - GX, sy = y + ay - GY;
        if (sx < 0 || sx >= W || sy < 0 || sy >= H || g[sy * W + sx]) continue;
      }
      if (mv(i, x, y, ax, ay)) return;
    }
  }
  function setGravity() {
    const rad = thetaT * Math.PI / 180;
    GX = Math.round(Math.sin(rad)) | 0;
    GY = Math.round(Math.cos(rad)) | 0;
    CARD = (GX === 0 || GY === 0);
    if (CARD) {
      const px = GY !== 0 ? 1 : 0, py = GX !== 0 ? 1 : 0;
      A1X = GX + px; A1Y = GY + py; A2X = GX - px; A2Y = GY - py;
    } else {
      A1X = GX; A1Y = 0; A2X = 0; A2Y = GY;
    }
  }
  function simStep() {
    flip = !flip;
    if (GX !== 0 && GY === 0) {
      for (let xk = 0; xk < W; xk++) {
        const x = GX > 0 ? W - 1 - xk : xk;
        for (let yk = 0; yk < H; yk++) cell(x, flip ? yk : H - 1 - yk);
      }
    } else {
      for (let yk = 0; yk < H; yk++) {
        const y = GY > 0 ? H - 1 - yk : yk;
        for (let xk = 0; xk < W; xk++) {
          const x = GX > 0 ? W - 1 - xk : (GX < 0 ? xk : (flip ? xk : W - 1 - xk));
          cell(x, y);
        }
      }
    }
  }

  // same-color group touching opposite walls (left-right or top-bottom)
  function checkClear() {
    visited.fill(0);
    let cleared = 0;
    const groupsC = [];
    for (let s = 0; s < N; s++) {
      const c = g[s];
      if (!c || fl[s] || visited[s]) continue;
      let sp = 0, n = 0, tL = false, tR = false, tT = false, tB = false;
      stack[sp++] = s; visited[s] = 1;
      while (sp) {
        const i = stack[--sp];
        list[n++] = i;
        const x = i % W, yy = (i / W) | 0;
        if (x === 0) tL = true;
        if (x === W - 1) tR = true;
        if (yy === 0) tT = true;
        if (yy === H - 1) tB = true;
        for (let dy = -1; dy <= 1; dy++) {
          const ny = yy + dy;
          if (ny < 0 || ny >= H) continue;
          for (let dx = -1; dx <= 1; dx++) {
            if (!dx && !dy) continue;
            const nx = x + dx;
            if (nx < 0 || nx >= W) continue;
            const j = ny * W + nx;
            if (!visited[j] && g[j] === c && !fl[j]) { visited[j] = 1; stack[sp++] = j; }
          }
        }
      }
      if ((tL && tR) || (tT && tB)) {
        for (let k = 0; k < n; k++) fl[list[k]] = 22;
        cleared += n;
        groupsC.push(c, n);
      }
    }
    if (cleared > 0) {
      score += cleared;
      combo = (frameNo - lastClearF <= 240) ? combo + 1 : 0;
      lastClearF = frameNo;
      Sfx.clear(cleared, combo);
      if (versus && vs.on) vsAttack(groupsC, combo);
      showPop('+' + cleared);
      try { navigator.vibrate && navigator.vibrate(25); } catch (e) {}
      const nl = 1 + Math.floor(score / 800);
      if (!versus && nl > level) { level = nl; setTimeout(() => showPop('LEVEL ' + level), 700); setTimeout(() => Sfx.level(), 550); }
      updateHUD();
    }
  }

  // moving the dropper: drag sideways (along the frame's top edge), release to drop
  function fingerCellX(e) {
    const r = stage.getBoundingClientRect();
    const vx = e.clientX - (r.left + r.width / 2), vy = e.clientY - (r.top + r.height / 2);
    const rad = theta * Math.PI / 180;
    const u = (vx * Math.cos(rad) + vy * Math.sin(rad)) / K;
    return (u + FW / 2 - 5) / (CELL / DPR);
  }
  stage.addEventListener('pointerdown', e => {
    if (state !== 'play') return;
    dragOn = true; fc0 = fingerCellX(e); dx0 = dropX;
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  });
  stage.addEventListener('pointermove', e => {
    if (!dragOn || state !== 'play' || !cur) return;
    dropX = Math.max(0, Math.min(W - cur.w, dx0 + fingerCellX(e) - fc0));
    const rx = Math.round(dropX);
    if (rx !== lastTickX) { lastTickX = rx; Sfx.move(); }
  });
  stage.addEventListener('pointerup', () => {
    if (!dragOn) return;
    dragOn = false;
    tryDrop(false);
  });
  stage.addEventListener('pointercancel', () => { dragOn = false; });
  $('bL').addEventListener('click', () => { if (state === 'play') { thetaT -= 45; Sfx.tilt(); } });
  $('bR').addEventListener('click', () => { if (state === 'play') { thetaT += 45; Sfx.tilt(); } });

  function updateHUD() {
    $('score').textContent = score;
    $('lv').textContent = versus ? garbageQ.reduce((a, b) => a + b, 0) : level;
    const s = $('spill');
    s.textContent = spilled + '/' + SPILL_MAX;
    s.classList.toggle('warn', spilled > SPILL_MAX * 0.5);
  }
  function updateChip() { $('chip').style.background = PAL[nextBlob.c - 1]; }
  function showPop(t) {
    const p = $('pop');
    p.textContent = t;
    p.classList.remove('show');
    void p.offsetWidth;
    p.classList.add('show');
  }

  function gameOver(spillOut) {
    if (versus) { vsEliminate(spillOut ? 'spill' : 'full'); return; }
    state = 'over';
    dragging = false; dragOn = false;
    Sfx.over();
    const finalScore = score, finalLevel = level;
    const isBest = finalScore > best;
    if (isBest) { best = finalScore; try { localStorage.setItem('sandshake-best', String(best)); } catch (e) {} }
    $('ovT').textContent = spillOut ? 'こぼれた!' : 'あふれた!';
    $('ovScore').textContent = finalScore;
    $('ovBest').textContent = isBest ? '自己ベスト更新!' : 'ベスト ' + best;
    $('ovRank').textContent = '';
    show('vOver');
    try { navigator.vibrate && navigator.vibrate([60, 40, 60]); } catch (e) {}

    if (finalScore > 0) {
      $('ovRank').textContent = 'ランキングに登録中…';
      submitScore(finalScore, finalLevel).then(r => {
        if (state !== 'over') return;
        $('ovRank').textContent = r.rank
          ? 'ランキング ' + r.rank + '位(あなたの最高 ' + r.mine + '点)'
          : 'ランキングに登録しました(あなたの最高 ' + r.mine + '点)';
      }).catch(e => {
        console.error(e);
        if (state === 'over') $('ovRank').textContent = 'ランキングに登録できませんでした(' + errTag(e) + ')';
      });
    } else {
      $('ovRank').textContent = '0点はランキングに載りません';
    }
  }
  function startGame(opts) {
    endSpectUi();
    rng = opts ? mulberry32(opts.seed) : null;
    garbageQ.fill(0); pourColor = -1; vsTicks = 0;
    setVsUi(!!opts);
    g.fill(0); sh.fill(0); fl.fill(0);
    score = 0; level = 1; spilled = 0; blocked = 0; frameNo = 0; lastColor = 0; cool = 0; holdT = 0;
    landT = 0; combo = 0; lastClearF = -9999;
    theta = thetaT = 0; dragging = false; dragOn = false;
    setGravity();
    cur = makeBlob(); nextBlob = makeBlob();
    dropX = (W - cur.w) / 2;
    updateChip(); updateHUD();
    $('ov').hidden = true;
    state = versus ? 'count' : 'play';
    if (versus) countdown();
  }

  function tick() {
    if (state === 'spectate') { specTick(); return; }
    if (state !== 'play') return;
    setGravity();
    if (versus) { vsTick(); if (state !== 'play') return; }
    if (GY >= 0) {
      if (cool > 0) cool--;
      else {
        holdT++;
        const rem = holdLimit() - holdT;
        if (rem > 0 && rem <= 180 && rem % 60 === 0) Sfx.warn();
        if (holdT >= holdLimit()) tryDrop(true);
        if (!anyFree()) { if (++blocked > 90) { gameOver(false); return; } }
        else blocked = 0;
      }
    } else blocked = 0;
    if (landT > 0 && --landT === 0) Sfx.land(landSize);
    const before = spilled;
    simStep();
    simStep();
    for (let i = 0; i < N; i++) {
      if (fl[i] && --fl[i] === 0) g[i] = 0;
    }
    if (spilled !== before) {
      Sfx.spill();
      updateHUD();
      if (spilled >= SPILL_MAX) { gameOver(true); return; }
    }
    frameNo++;
    if (frameNo % 5 === 0) checkClear();
  }

  function applyTransform() {
    const r = theta * Math.PI / 180, c = Math.abs(Math.cos(r)), s = Math.abs(Math.sin(r));
    const bw = FW * c + FH * s, bh = FW * s + FH * c;
    const k = Math.min(1, AW / bw, AH / bh);
    K = k;
    frame.style.transform = 'rotate(' + theta.toFixed(2) + 'deg) scale(' + k.toFixed(4) + ')';
  }

  function render(t) {
    if (state === 'spectate' && specWatch) fillSpectate(specWatch);
    else for (let i = 0; i < N; i++) {
      const c = g[i];
      if (!c) { buf[i] = 0; continue; }
      const f = fl[i];
      buf[i] = (f && ((f >> 1) & 1)) ? WHITE : pal[(c - 1) * SHADES + sh[i]];
    }
    octx.putImageData(img, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(off, 0, 0, cv.width, cv.height);

    const pulse = blocked > 0 ? 0.55 + 0.45 * Math.sin(t * 0.02) : 0.55;
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.strokeStyle = dangerColor;
    ctx.lineWidth = 2 * DPR;
    ctx.setLineDash([8 * DPR, 6 * DPR]);
    ctx.beginPath();
    ctx.moveTo(0, WARN_ROW * CELL);
    ctx.lineTo(cv.width, WARN_ROW * CELL);
    ctx.stroke();
    ctx.restore();

    if (state === 'play' && cur && cool === 0 && GY >= 0) {
      const x0 = Math.round(dropX), col = PAL[cur.c - 1];
      ctx.save();
      if (GY === 1 && GX === 0) { // landing guide
        let top = H;
        for (let x = x0; x < x0 + cur.w; x++) {
          let y = cur.h;
          while (y < H && !g[y * W + x]) y++;
          if (y < top) top = y;
        }
        ctx.globalAlpha = 0.14;
        ctx.fillStyle = col;
        ctx.fillRect(x0 * CELL, cur.h * CELL, cur.w * CELL, Math.max(0, top - cur.h) * CELL);
      }
      ctx.globalAlpha = 0.92; // the sand being held
      ctx.fillStyle = col;
      for (let y = 0; y < cur.h; y++) for (let x = 0; x < cur.w; x++) {
        if ((y === 0 || y === cur.h - 1) && (x === 0 || x === cur.w - 1)) continue;
        ctx.fillRect((x0 + x) * CELL, y * CELL, CELL, CELL);
      }
      ctx.globalAlpha = 0.6;
      ctx.strokeStyle = inkColor;
      ctx.lineWidth = 1.5 * DPR;
      ctx.setLineDash([4 * DPR, 3 * DPR]);
      ctx.strokeRect(x0 * CELL + 0.5, 0.5, cur.w * CELL - 1, cur.h * CELL - 1);
      const ratio = Math.max(0, 1 - holdT / holdLimit()); // time until auto-drop
      ctx.globalAlpha = 1;
      ctx.setLineDash([]);
      ctx.fillStyle = ratio < 0.25 ? dangerColor : col;
      ctx.fillRect(0, 0, cv.width * ratio, 3 * DPR);
      ctx.restore();
    }
  }

  function readTheme() {
    const cs = getComputedStyle(document.documentElement);
    dangerColor = cs.getPropertyValue('--danger').trim() || dangerColor;
    inkColor = cs.getPropertyValue('--ink').trim() || inkColor;
  }

  let last = 0, acc = 0, themeT = 0;
  function loop(t) {
    requestAnimationFrame(loop);
    if (!last) last = t;
    const dt = Math.min(50, t - last);
    last = t;
    acc += dt;
    while (acc >= 16.667) { tick(); acc -= 16.667; }
    if (state === 'spectate' && specWatch) thetaT = specWatch.th;
    if (!dragging) {
      const d = thetaT - theta;
      theta = Math.abs(d) < 0.05 ? thetaT : theta + d * Math.min(1, dt * 0.014);
    }
    applyTransform();
    if (!vsBarEl.hidden) vsAnimate(dt);
    if (t - themeT > 500) { readTheme(); themeT = t; }
    render(t);
  }

  function resize() {
    DPR = window.devicePixelRatio || 1;
    AW = stage.clientWidth - 24;
    AH = stage.clientHeight - 16;
    const css = Math.max(1, Math.min((AW - 10) / W, (AH - 5) / H));
    CELL = Math.max(2, Math.floor(css * DPR));
    cv.width = W * CELL;
    cv.height = H * CELL;
    cv.style.width = (W * CELL / DPR) + 'px';
    cv.style.height = (H * CELL / DPR) + 'px';
    FW = W * CELL / DPR + 10;
    FH = H * CELL / DPR + 5;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

  const muteBtn = $('muteBtn');
  const syncMute = () => { muteBtn.classList.toggle('off', Sfx.muted); muteBtn.setAttribute('aria-pressed', String(Sfx.muted)); };
  muteBtn.addEventListener('click', () => {
    Sfx.setMuted(!Sfx.muted);
    syncMute();
    if (!Sfx.muted) Sfx.click();
  });
  syncMute();

  buildTitle();
  buildRules();
  readTheme();
  resize();
  setGravity();
  show('vHome');
  ensureFb().catch(e => console.warn('Firebase init failed:', e)); // sign in anonymously in the background
  requestAnimationFrame(loop);
})();
</script>
</body>
