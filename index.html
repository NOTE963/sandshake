<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAND SHAKE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #e6ebf5;
  --panel: #ffffff;
  --ink: #1c2233;
  --muted: #5d667e;
  --frame: #2a3350;
  --well: #f7f9fe;
  --danger: #e5484d;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10131c; --panel: #1b2033; --ink: #e8ecf7; --muted: #8b94ad;
    --frame: #46527a; --well: #171b29; --danger: #ff6369;
  }
}
:root[data-theme="dark"] {
  --bg: #10131c; --panel: #1b2033; --ink: #e8ecf7; --muted: #8b94ad;
  --frame: #46527a; --well: #171b29; --danger: #ff6369;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--ink);
  font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.hud { flex: none; display: flex; align-items: center; gap: 16px; padding: 10px 16px 2px; }
.stat { display: flex; flex-direction: column; line-height: 1.1; }
.stat span, .next span { font-size: 11px; color: var(--muted); font-weight: 500; }
.stat b { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat b.sm { font-size: 17px; line-height: 1.5; }
.stat b.warn { color: var(--danger); }
.next { display: flex; flex-direction: column; gap: 4px; margin-left: auto; }
.next span { line-height: 1.1; }
.next i { display: block; width: 26px; height: 22px; border-radius: 7px; background: #999; }
#muteBtn {
  flex: none;
  width: 40px; height: 40px;
  display: grid; place-items: center;
  color: var(--ink);
  background: transparent;
  border: 2px solid var(--frame);
  border-radius: 12px;
  padding: 0;
}
#muteBtn:active { background: var(--frame); color: var(--bg); }
#muteBtn:focus-visible { outline: 3px solid #4a6cf7; outline-offset: 2px; }
#muteBtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
#muteBtn:not(.off) .xmark { display: none; }
#muteBtn.off .waves { display: none; }
#muteBtn.off { opacity: .6; }
#stage {
  flex: 1;
  min-height: 0;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 8px 12px;
  overflow: hidden;
  touch-action: none;
}
#frame {
  position: relative;
  flex: none;
  border: 5px solid var(--frame);
  border-top: none;
  border-radius: 0 0 16px 16px;
  background: var(--well);
  overflow: hidden;
  line-height: 0;
  will-change: transform;
}
#cv { display: block; }
#pop {
  position: absolute;
  left: 50%;
  top: 14%;
  transform: translateX(-50%);
  font-family: "DotGothic16", "M PLUS Rounded 1c", sans-serif;
  font-size: 40px;
  line-height: 1;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  color: var(--ink);
  text-shadow: 0 0 6px var(--bg), 0 0 12px var(--bg), 0 0 18px var(--bg);
  z-index: 4;
}
#pop.show { animation: pop 1000ms ease-out; }
@keyframes pop {
  0% { opacity: 0; transform: translate(-50%, 10px) scale(.8); }
  18% { opacity: 1; transform: translate(-50%, 0) scale(1.1); }
  100% { opacity: 0; transform: translate(-50%, -44px) scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  #pop.show { animation: popfade 1000ms linear; }
  @keyframes popfade { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
}
.pad { flex: none; display: flex; gap: 12px; padding: 4px 16px 12px; }
.pad button {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font: inherit;
  font-weight: 800;
  font-size: 15px;
  color: var(--ink);
  background: transparent;
  border: 2px solid var(--frame);
  border-radius: 16px;
  padding: 14px 10px;
}
.pad button:active { background: var(--frame); color: var(--bg); }
.pad svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

/* overlay + screens */
.ov {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  z-index: 5;
}
.ov[hidden] { display: none; }
.card {
  width: min(100%, 350px);
  max-height: 100%;
  overflow: auto;
  background: var(--panel);
  border: 3px solid var(--frame);
  border-radius: 22px;
  padding: 22px 20px 18px;
  text-align: center;
}
.card[hidden] { display: none; }
.card h2 {
  margin: 0 0 14px;
  font-family: "DotGothic16", "M PLUS Rounded 1c", sans-serif;
  font-weight: 400;
  font-size: 26px;
  letter-spacing: .08em;
  line-height: 1.2;
}
#title { display: block; width: 100%; max-width: 300px; height: auto; margin: 4px auto 14px; overflow: visible; }
.tag { margin: 0 0 6px; font-size: 14px; color: var(--muted); line-height: 1.6; }
.bestline { margin: 0 0 16px; font-family: "DotGothic16", sans-serif; font-size: 15px; min-height: 1.4em; }
.btns { display: flex; flex-direction: column; gap: 10px; }
.btn {
  font: inherit;
  font-weight: 800;
  font-size: 16px;
  color: var(--ink);
  background: transparent;
  border: 2px solid var(--frame);
  border-radius: 14px;
  padding: 13px 20px;
  width: 100%;
}
.btn.primary { color: var(--bg); background: var(--ink); border-color: var(--ink); font-size: 18px; padding: 15px 20px; }
.btn:active { transform: scale(.98); }
.btn:focus-visible, .pad button:focus-visible, #nameIn:focus-visible { outline: 3px solid #4a6cf7; outline-offset: 2px; }
.rules { margin: 0 0 16px; padding: 0; list-style: none; text-align: left; font-size: 14px; line-height: 1.65; }
.rules li { position: relative; padding-left: 22px; margin-bottom: 9px; }
.rules li::before { content: ""; position: absolute; left: 2px; top: .55em; width: 10px; height: 10px; border-radius: 3px; background: var(--c, var(--muted)); }
.score { font-size: 15px; line-height: 1.7; margin: 0 0 8px; color: var(--muted); }
.score b { font-family: "DotGothic16", sans-serif; font-weight: 400; font-size: 48px; color: var(--ink); display: block; line-height: 1.2; font-variant-numeric: tabular-nums; }
.rankmsg { min-height: 1.6em; margin: 0 0 16px; font-size: 14px; color: var(--ink); }
.rank { list-style: none; margin: 0 0 10px; padding: 0; max-height: 36vh; overflow: auto; text-align: left; font-size: 15px; }
.rank li { display: grid; grid-template-columns: 2.6em 1fr auto; gap: 8px; padding: 6px 8px; border-radius: 8px; font-variant-numeric: tabular-nums; }
.rank li.me { background: color-mix(in srgb, var(--ink) 12%, transparent); font-weight: 800; }
.rank .n { font-family: "DotGothic16", sans-serif; color: var(--muted); }
.rank .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .sc { font-family: "DotGothic16", sans-serif; font-size: 17px; }
.rankstate { font-size: 13px; color: var(--muted); min-height: 1.5em; margin: 0 0 8px; line-height: 1.5; }
.namebox { display: flex; gap: 8px; margin: 0 0 12px; }
#nameIn {
  flex: 1;
  min-width: 0;
  font: inherit;
  font-size: 16px;
  color: var(--ink);
  background: var(--well);
  border: 2px solid var(--frame);
  border-radius: 12px;
  padding: 9px 12px;
  -webkit-user-select: text;
  user-select: text;
}
.namebox .btn { width: auto; padding: 9px 16px; font-size: 14px; }
</style>
</head>
<body>

      <p class="score">スコア<b id="ovScore">0</b><span id="ovBest"></span></p>
      <p class="rankmsg" id="ovRank"></p>
      <div class="btns">
        <button class="btn primary" type="button" data-act="start">もういちど</button>
        <button class="btn" type="button" data-act="rank">ランキング</button>
        <button class="btn" type="button" data-act="home">ホーム</button>
      </div>
    </section>
  </div>
</main>
<div class="pad">
  <button id="bL" type="button" aria-label="左に傾ける">
    <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>ひだりに傾ける
  </button>
  <button id="bR" type="button" aria-label="右に傾ける">
    みぎに傾ける<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
  </button>
</div>

<script>
// ============================================================
//  Firebase (anonymous auth + Firestore ranking)
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyC2y2yyzcHr5Lfh1CPhOI8ABDASmy0v1e4",
  authDomain: "sand-shake.firebaseapp.com",
  projectId: "sand-shake",
  storageBucket: "sand-shake.firebasestorage.app",
  messagingSenderId: "903859599063",
  appId: "1:903859599063:web:0a1ad317f217f0bb25a292",
  measurementId: "G-V8FNFSXP8H"
};
const FB_VER = '10.12.2';
const FB_BASE = 'https://www.gstatic.com/firebasejs/' + FB_VER + '/';

// ============================================================
//  Sound effects (Web Audio, synthesized: no audio files)
// ============================================================
const Sfx = (() => {
  let ac = null, master = null, noiseBuf = null, muted = false;
  try { muted = localStorage.getItem('sandshake-mute') === '1'; } catch (e) {}
  const last = {};
  const throttle = (k, ms) => { const n = performance.now(); if (last[k] && n - last[k] < ms) return false; last[k] = n; return true; };

  function init() {
    try {
      if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = muted ? 0 : 0.8;
      const comp = ac.createDynamicsCompressor();
      master.connect(comp); comp.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 1.5, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
  }
  const ok = () => ac && !muted && ac.state !== 'closed';

  function env(g, t0, att, dur, vol) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + att);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  }
  function tone(f, dur, o = {}) {
    if (!ok()) return;
    const t0 = ac.currentTime + (o.delay || 0);
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
    env(g, t0, o.att || 0.006, dur, o.vol == null ? 0.2 : o.vol);
    osc.connect(g); g.connect(master);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  }
  function noise(dur, o = {}) {
    if (!ok()) return;
    const t0 = ac.currentTime + (o.delay || 0);
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf;
    f.type = o.type || 'bandpass';
    f.Q.value = o.q || 1;
    f.frequency.setValueAtTime(o.f0 || 1000, t0);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t0 + dur);
    env(g, t0, o.att || 0.01, dur, o.vol == null ? 0.1 : o.vol);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0, Math.random() * 0.3); src.stop(t0 + dur + 0.05);
  }

  const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26];
  const hz = (base, semis) => base * Math.pow(2, semis / 12);

  return {
    init,
    get muted() { return muted; },
    setMuted(m) {
      muted = m;
      try { localStorage.setItem('sandshake-mute', m ? '1' : '0'); } catch (e) {}
      if (master) master.gain.value = m ? 0 : 0.8;
    },
    click() { tone(660, 0.05, { type: 'triangle', to: 880, vol: 0.1 }); },
    start() { tone(523, 0.1, { type: 'triangle', vol: 0.14 }); tone(784, 0.16, { type: 'triangle', vol: 0.14, delay: 0.08 }); tone(1047, 0.22, { type: 'sine', vol: 0.1, delay: 0.16 }); },
    move() { if (throttle('move', 45)) tone(1400, 0.03, { type: 'sine', vol: 0.035 }); },
    drop() {
      tone(720, 0.16, { type: 'sine', to: 160, vol: 0.2 });
      noise(0.2, { f0: 2200, f1: 500, q: 0.8, vol: 0.09 });
    },
    land(size) {
      const k = Math.min(1, 0.45 + size / 90);
      noise(0.22, { type: 'lowpass', f0: 900, f1: 220, q: 0.7, vol: 0.2 * k, att: 0.004 });
      tone(120, 0.18, { type: 'sine', to: 52, vol: 0.26 * k, att: 0.004 });
      noise(0.12, { type: 'highpass', f0: 3500, vol: 0.04 * k, delay: 0.02 });
    },
    tilt() {
      noise(0.5, { f0: 700, f1: 2600, q: 0.6, vol: 0.11, att: 0.06 });
      tone(300, 0.08, { type: 'triangle', to: 200, vol: 0.08 });
    },
    clear(n, combo) {
      const shift = Math.min(combo, 6) * 1; // semitones up per combo
      const base = hz(523.25, shift);
      const count = Math.min(10, 4 + Math.floor(n / 45));
      noise(0.45, { f0: 500, f1: 5000, q: 0.7, vol: 0.13, att: 0.03 });
      for (let i = 0; i < count; i++) {
        const f = hz(base, SCALE[i]);
        const d = i * 0.055;
        tone(f, 0.28, { type: 'triangle', vol: 0.15, delay: d });
        tone(f * 2, 0.2, { type: 'sine', vol: 0.06, delay: d + 0.01 });
      }
      const end = count * 0.055;
      tone(hz(base, SCALE[count - 1]) * 2, 0.6, { type: 'sine', vol: 0.09, delay: end });
      tone(hz(base, SCALE[count - 1]) * 3, 0.45, { type: 'sine', vol: 0.05, delay: end + 0.03 });
      if (n >= 180) tone(90, 0.3, { type: 'sine', to: 45, vol: 0.28 });
    },
    level() {
      [0, 4, 7, 12, 16].forEach((s, i) => tone(hz(523.25, s), 0.3, { type: 'triangle', vol: 0.16, delay: i * 0.09 }));
      tone(hz(523.25, 24), 0.7, { type: 'sine', vol: 0.1, delay: 0.5 });
      tone(hz(523.25, 19), 0.7, { type: 'sine', vol: 0.08, delay: 0.5 });
    },
    spill() { if (throttle('spill', 110)) noise(0.09, { type: 'highpass', f0: 3200, vol: 0.05 }); },
    warn() { tone(880, 0.09, { type: 'square', vol: 0.05 }); },
    over() {
      [392, 349, 294, 220].forEach((f, i) => tone(f, 0.34, { type: 'triangle', vol: 0.17, delay: i * 0.17 }));
      tone(110, 1.0, { type: 'sine', to: 70, vol: 0.2, delay: 0.7 });
      noise(0.8, { type: 'lowpass', f0: 1500, f1: 200, vol: 0.12, delay: 0.5, att: 0.1 });
    }
  };
})();
['pointerdown', 'touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, () => Sfx.init(), true));

(() => {
  const W = 60, H = 72, N = W * H, WARN_ROW = 8, SPILL_MAX = 80;
  const PAL = ['#ef5b5b', '#f7b733', '#1fb5a5', '#4a6cf7', '#b45cd6'];
  const SHADES = 6;
  const WHITE = 0xFFFFFFFF;

  const pal = new Uint32Array(PAL.length * SHADES);
  PAL.forEach((hex, ci) => {
    const r = parseInt(hex.slice(1, 3), 16), gg0 = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    for (let s = 0; s < SHADES; s++) {
      const f = 0.82 + s * 0.06;
      const rr = Math.min(255, Math.round(r * f)), gg = Math.min(255, Math.round(gg0 * f)), bb = Math.min(255, Math.round(b * f));
      pal[ci * SHADES + s] = ((255 << 24) | (bb << 16) | (gg << 8) | rr) >>> 0;
    }
  });

  const g = new Uint8Array(N);
  const sh = new Uint8Array(N);
  const fl = new Uint8Array(N);
  const visited = new Uint8Array(N);
  const stack = new Int32Array(N);
  const list = new Int32Array(N);

  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const stage = $('stage'), frame = $('frame');
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const octx = off.getContext('2d');
  const img = octx.createImageData(W, H);
  const buf = new Uint32Array(img.data.buffer);

  let CELL = 6, DPR = 1, FW = 300, FH = 360, AW = 300, AH = 400;
  let state = 'ready';
  let score = 0, level = 1, best = 0, spilled = 0;
  let blocked = 0, frameNo = 0, lastColor = 0;
  let cur = null, nextBlob = null, flip = false;
  let dropX = 0, cool = 0, holdT = 0, dragOn = false, fc0 = 0, dx0 = 0, K = 1;
  let landT = 0, landSize = 0, combo = 0, lastClearF = -9999, lastTickX = -1;
  let theta = 0, thetaT = 0, dragging = false, dragX0 = 0, dragTh0 = 0;
  let GX = 0, GY = 1;
  let dangerColor = '#e5484d', inkColor = '#1c2233';
  let playerName = '';

  // ---------- local storage (best score / nickname) ----------
  try { best = parseInt(localStorage.getItem('sandshake-best') || '0', 10) || 0; } catch (e) {}
  try { playerName = localStorage.getItem('sandshake-name') || ''; } catch (e) {}
  if (!playerName) {
    playerName = 'ゲスト' + String(Math.floor(Math.random() * 10000)).padStart(4, '0');
    try { localStorage.setItem('sandshake-name', playerName); } catch (e) {}
  }
  const cleanName = s => [...String(s).replace(/[\u0000-\u001f<>]/g, '').trim()].slice(0, 10).join('');

  // ============================================================
  //  Firebase helpers
  // ============================================================
  let fbP = null;
  function ensureFb() {
    if (fbP) return fbP;
    fbP = (async () => {
      const [appM, authM, fs] = await Promise.all([
        import(FB_BASE + 'firebase-app.js'),
        import(FB_BASE + 'firebase-auth.js'),
        import(FB_BASE + 'firebase-firestore.js')
      ]);
      const app = appM.getApps().length ? appM.getApp() : appM.initializeApp(firebaseConfig);
      const auth = authM.getAuth(app);
      await auth.authStateReady();
      const user = auth.currentUser || (await authM.signInAnonymously(auth)).user;
      return { fs, db: fs.getFirestore(app), uid: user.uid };
    })().catch(e => { fbP = null; throw e; });
    return fbP;
  }

  // submit score (only if it beats the player's stored best); returns { mine, rank }
  async function submitScore(sc, lv) {
    const { fs, db, uid } = await ensureFb();
    const ref = fs.doc(db, 'scores', uid);
    const snap = await fs.getDoc(ref);
    let mine = snap.exists() ? snap.data().score : 0;
    if (sc > mine) {
      await fs.setDoc(ref, { name: playerName, score: sc, level: lv, updatedAt: fs.serverTimestamp() });
      mine = sc;
    }
    const cnt = await fs.getCountFromServer(fs.query(fs.collection(db, 'scores'), fs.where('score', '>', mine)));
    return { mine, rank: cnt.data().count + 1 };
  }

  async function loadRanking() {
    const { fs, db, uid } = await ensureFb();
    const q = fs.query(fs.collection(db, 'scores'), fs.orderBy('score', 'desc'), fs.limit(30));
    const snaps = await fs.getDocs(q);
    const rows = [];
    snaps.forEach(d => rows.push({ id: d.id, ...d.data() }));
    let me = null;
    const mySnap = await fs.getDoc(fs.doc(db, 'scores', uid));
    if (mySnap.exists()) {
      const s = mySnap.data().score;
      const cnt = await fs.getCountFromServer(fs.query(fs.collection(db, 'scores'), fs.where('score', '>', s)));
      me = { score: s, rank: cnt.data().count + 1 };
    }
    return { rows, uid, me };
  }

  async function renameOnServer(name) {
    const { fs, db, uid } = await ensureFb();
    const ref = fs.doc(db, 'scores', uid);
    const snap = await fs.getDoc(ref);
    if (snap.exists()) await fs.updateDoc(ref, { name, updatedAt: fs.serverTimestamp() });
  }

  // ============================================================
  //  Screens
  // ============================================================
  const VIEWS = ['vHome', 'vRules', 'vRank', 'vOver'];

  // dot-font title built from a 5x7 bitmap font
  const FONT = {
    S: ['01111', '10000', '10000', '01110', '00001', '00001', '11110'],
    A: ['01110', '10001', '10001', '11111', '10001', '10001', '10001'],
    N: ['10001', '11001', '10101', '10101', '10101', '10011', '10001'],
    D: ['11110', '10001', '10001', '10001', '10001', '10001', '11110'],
    H: ['10001', '10001', '10001', '11111', '10001', '10001', '10001'],
    K: ['10001', '10010', '10100', '11000', '10100', '10010', '10001'],
    E: ['11111', '10000', '10000', '11110', '10000', '10000', '11111']
  };
  function buildTitle() {
    const lines = [
      { t: 'SAND', c: [0, 1, 2, 3] },
      { t: 'SHAKE', c: [4, 0, 1, 2, 3] }
    ];
    const totalW = 29, lineH = 7, gap = 2;
    let out = '';
    lines.forEach((ln, li) => {
      const wLine = ln.t.length * 5 + (ln.t.length - 1);
      let ox = (totalW - wLine) / 2;
      const oy = li * (lineH + gap);
      [...ln.t].forEach((ch, ci) => {
        const rows = FONT[ch];
        const col = PAL[ln.c[ci]];
        for (let y = 0; y < 7; y++) for (let x = 0; x < 5; x++) {
          if (rows[y][x] !== '1') continue;
          const px = ox + x, py = oy + y;
          const v = 0.8 + ((x * 7 + y * 13 + ci * 5) % 5) * 0.05;
          out += '<rect x="' + (px + 0.14) + '" y="' + (py + 0.14) + '" width="0.88" height="0.88" rx="0.2" style="fill:var(--frame)" opacity="0.28"/>';
          out += '<rect x="' + px + '" y="' + py + '" width="0.88" height="0.88" rx="0.2" fill="' + col + '" opacity="' + v.toFixed(2) + '"/>';
        }
        ox += 6;
      });
    });
    const svg = $('title');
    svg.setAttribute('viewBox', '-0.5 -0.5 ' + (totalW + 1) + ' ' + (lineH * 2 + gap + 1));
    svg.innerHTML = out;
  }

  $('nameSave').addEventListener('click', async () => {
    const nm = cleanName($('nameIn').value);
    if (!nm) { $('nameIn').value = playerName; return; }
    playerName = nm;
    $('nameIn').value = nm;

    try { await renameOnServer(nm); } catch (e) { console.error(e); }

  $('ov').addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const a = b.dataset.act;
    if (a === 'start') { Sfx.start(); startGame(); return; }
    Sfx.click();
    if (a === 'home') show('vHome');
    else if (a === 'rules') show('vRules');
    else if (a === 'rank') openRank();
  });

  // ============================================================
  //  Game
  // ============================================================
  const numColors = () => Math.min(5, 1 + level);
  const holdLimit = () => Math.max(240, 720 - (level - 1) * 90); // ticks (60/sec)

  function swap(i, j) {
    let t = g[i]; g[i] = g[j]; g[j] = t;
    t = sh[i]; sh[i] = sh[j]; sh[j] = t;
  }

  function makeBlob() {
    let c = 1 + Math.floor(Math.random() * numColors());
    if (c === lastColor && Math.random() < 0.6) c = 1 + Math.floor(Math.random() * numColors());
    lastColor = c;
    const w = 8 + Math.floor(Math.random() * 7);
    const h = 4 + Math.floor(Math.random() * 3);
    return { c, w, h };
  }
  function areaFree(x0) {
    if (x0 < 0 || x0 + cur.w > W) return false;
    for (let y = 0; y < cur.h; y++)
      for (let x = x0; x < x0 + cur.w; x++)
        if (g[y * W + x]) return false;
    return true;
  }
  function findX(x) {
    const r = Math.round(x);
    for (let d = 0; d <= 4; d++) {
      if (areaFree(r + d)) return r + d;
      if (d && areaFree(r - d)) return r - d;
    }
    return -1;
  }
  function anyFree() {
    for (let x0 = 0; x0 + cur.w <= W; x0++) if (areaFree(x0)) return true;
    return false;
  }
  function tryDrop(auto) {
    if (state !== 'play' || cool > 0 || GY < 0 || !cur) return;
    const x0 = findX(dropX);
    if (x0 < 0) {
      if (!auto) { try { navigator.vibrate && navigator.vibrate(20); } catch (e) {} }
      return;
    }
    const b = cur;
    for (let y = 0; y < b.h; y++) {
      for (let x = 0; x < b.w; x++) {
        if ((y === 0 || y === b.h - 1) && (x === 0 || x === b.w - 1)) continue;
        const i = y * W + x0 + x;
        g[i] = b.c;
        sh[i] = Math.floor(Math.random() * SHADES);
      }
    }
    // estimate when the sand reaches the pile, for the landing sound
    let dist = 24;
    if (GY === 1 && GX === 0) {
      let top = H;
      for (let x = x0; x < x0 + b.w; x++) {
        let y = b.h;
        while (y < H && !g[y * W + x]) y++;
        if (y < top) top = y;
      }
      dist = Math.max(0, top - b.h);
    }
    landT = Math.max(3, Math.round(dist / 2));
    landSize = b.w * b.h;
    Sfx.drop();
    cur = nextBlob;
    nextBlob = makeBlob();
    updateChip();
    dropX = Math.max(0, Math.min(W - cur.w, x0 + b.w / 2 - cur.w / 2));
    cool = 22;
    holdT = 0;
  }

  // sand simulation with 8-direction gravity (frame coordinates)
  let CARD = true, A1X = 1, A1Y = 1, A2X = -1, A2Y = 1;
  function mv(i, x, y, dx, dy) {
    const nx = x + dx, ny = y + dy;
    if (nx < 0 || nx >= W || ny >= H) return false;
    if (ny < 0) { g[i] = 0; sh[i] = 0; spilled++; return true; }
    const j = ny * W + nx;
    if (g[j]) return false;
    swap(i, j);
    return true;
  }
  function cell(x, y) {
    const i = y * W + x;
    if (!g[i] || fl[i]) return;
    if (mv(i, x, y, GX, GY)) return;
    const first = Math.random() < 0.5;
    for (let t = 0; t < 2; t++) {
      const k = ((t === 0) === first) ? 0 : 1;
      const ax = k ? A2X : A1X, ay = k ? A2Y : A1Y;
      if (CARD) {
        const sx = x + ax - GX, sy = y + ay - GY;
        if (sx < 0 || sx >= W || sy < 0 || sy >= H || g[sy * W + sx]) continue;
      }
      if (mv(i, x, y, ax, ay)) return;
    }
  }
  function setGravity() {
    const rad = thetaT * Math.PI / 180;
    GX = Math.round(Math.sin(rad)) | 0;
    GY = Math.round(Math.cos(rad)) | 0;
    CARD = (GX === 0 || GY === 0);
    if (CARD) {
      const px = GY !== 0 ? 1 : 0, py = GX !== 0 ? 1 : 0;
      A1X = GX + px; A1Y = GY + py; A2X = GX - px; A2Y = GY - py;
    } else {
      A1X = GX; A1Y = 0; A2X = 0; A2Y = GY;
    }
  }
  function simStep() {
    flip = !flip;
    if (GX !== 0 && GY === 0) {
      for (let xk = 0; xk < W; xk++) {
        const x = GX > 0 ? W - 1 - xk : xk;
        for (let yk = 0; yk < H; yk++) cell(x, flip ? yk : H - 1 - yk);
      }
    } else {
      for (let yk = 0; yk < H; yk++) {
        const y = GY > 0 ? H - 1 - yk : yk;
        for (let xk = 0; xk < W; xk++) {
          const x = GX > 0 ? W - 1 - xk : (GX < 0 ? xk : (flip ? xk : W - 1 - xk));
          cell(x, y);
        }
      }
    }
  }

  // same-color group touching opposite walls (left-right or top-bottom)
  function checkClear() {
    visited.fill(0);
    let cleared = 0;
    for (let s = 0; s < N; s++) {
      const c = g[s];
      if (!c || fl[s] || visited[s]) continue;
      let sp = 0, n = 0, tL = false, tR = false, tT = false, tB = false;
      stack[sp++] = s; visited[s] = 1;
      while (sp) {
        const i = stack[--sp];
        list[n++] = i;
        const x = i % W, yy = (i / W) | 0;
        if (x === 0) tL = true;
        if (x === W - 1) tR = true;
        if (yy === 0) tT = true;
        if (yy === H - 1) tB = true;
        for (let dy = -1; dy <= 1; dy++) {
          const ny = yy + dy;
          if (ny < 0 || ny >= H) continue;
          for (let dx = -1; dx <= 1; dx++) {
            if (!dx && !dy) continue;
            const nx = x + dx;
            if (nx < 0 || nx >= W) continue;
            const j = ny * W + nx;
            if (!visited[j] && g[j] === c && !fl[j]) { visited[j] = 1; stack[sp++] = j; }
          }
        }
      }
      if ((tL && tR) || (tT && tB)) {
        for (let k = 0; k < n; k++) fl[list[k]] = 22;
        cleared += n;
      }
    }
    if (cleared > 0) {
      score += cleared;
      combo = (frameNo - lastClearF <= 240) ? combo + 1 : 0;
      lastClearF = frameNo;
      Sfx.clear(cleared, combo);
      showPop('+' + cleared);
      try { navigator.vibrate && navigator.vibrate(25); } catch (e) {}
      const nl = 1 + Math.floor(score / 800);
      if (nl > level) { level = nl; setTimeout(() => showPop('LEVEL ' + level), 700); setTimeout(() => Sfx.level(), 550); }
      updateHUD();
    }
  }

  // moving the dropper: drag sideways (along the frame's top edge), release to drop
  function fingerCellX(e) {
    const r = stage.getBoundingClientRect();
    const vx = e.clientX - (r.left + r.width / 2), vy = e.clientY - (r.top + r.height / 2);
    const rad = theta * Math.PI / 180;
    const u = (vx * Math.cos(rad) + vy * Math.sin(rad)) / K;
    return (u + FW / 2 - 5) / (CELL / DPR);
  }
  stage.addEventListener('pointerdown', e => {
    if (state !== 'play') return;
    dragOn = true; fc0 = fingerCellX(e); dx0 = dropX;
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  });
  stage.addEventListener('pointermove', e => {
    if (!dragOn || state !== 'play' || !cur) return;
    dropX = Math.max(0, Math.min(W - cur.w, dx0 + fingerCellX(e) - fc0));
    const rx = Math.round(dropX);
    if (rx !== lastTickX) { lastTickX = rx; Sfx.move(); }
  });
  stage.addEventListener('pointerup', () => {
    if (!dragOn) return;
    dragOn = false;
    tryDrop(false);
  });
  stage.addEventListener('pointercancel', () => { dragOn = false; });
  $('bL').addEventListener('click', () => { if (state === 'play') { thetaT -= 45; Sfx.tilt(); } });
  $('bR').addEventListener('click', () => { if (state === 'play') { thetaT += 45; Sfx.tilt(); } });

  function updateHUD() {
    $('score').textContent = score;
    $('lv').textContent = level;
    const s = $('spill');
    s.textContent = spilled + '/' + SPILL_MAX;
    s.classList.toggle('warn', spilled > SPILL_MAX * 0.5);
  }
  function updateChip() { $('chip').style.background = PAL[nextBlob.c - 1]; }
  function showPop(t) {
    const p = $('pop');
    p.textContent = t;
    p.classList.remove('show');
    void p.offsetWidth;
    p.classList.add('show');
  }

  function gameOver(spillOut) {
    state = 'over';
    dragging = false; dragOn = false;
    Sfx.over();
    const finalScore = score, finalLevel = level;
    const isBest = finalScore > best;
    if (isBest) { best = finalScore; try { localStorage.setItem('sandshake-best', String(best)); } catch (e) {} }
    $('ovT').textContent = spillOut ? 'こぼれた!' : 'あふれた!';
    $('ovScore').textContent = finalScore;
    $('ovBest').textContent = isBest ? '自己ベスト更新!' : 'ベスト ' + best;
    $('ovRank').textContent = '';
    show('vOver');
    try { navigator.vibrate && navigator.vibrate([60, 40, 60]); } catch (e) {}

    if (finalScore > 0) {
      $('ovRank').textContent = 'ランキングに登録中…';
      submitScore(finalScore, finalLevel).then(r => {
        if (state === 'over') $('ovRank').textContent = 'ランキング ' + r.rank + '位(あなたの最高 ' + r.mine + '点)';
      }).catch(e => {
        console.error(e);
        if (state === 'over') $('ovRank').textContent = 'ランキングにつながりませんでした';
      });
    }
  }
  function startGame() {
    g.fill(0); sh.fill(0); fl.fill(0);
    score = 0; level = 1; spilled = 0; blocked = 0; frameNo = 0; lastColor = 0; cool = 0; holdT = 0;
    landT = 0; combo = 0; lastClearF = -9999;
    theta = thetaT = 0; dragging = false; dragOn = false;
    setGravity();
    cur = makeBlob(); nextBlob = makeBlob();
    dropX = (W - cur.w) / 2;
    updateChip(); updateHUD();
    $('ov').hidden = true;
    state = 'play';
  }

  function tick() {
    if (state !== 'play') return;
    setGravity();
    if (GY >= 0) {
      if (cool > 0) cool--;
      else {
        holdT++;
        const rem = holdLimit() - holdT;
        if (rem > 0 && rem <= 180 && rem % 60 === 0) Sfx.warn();
        if (holdT >= holdLimit()) tryDrop(true);
        if (!anyFree()) { if (++blocked > 90) { gameOver(false); return; } }
        else blocked = 0;
      }
    } else blocked = 0;
    if (landT > 0 && --landT === 0) Sfx.land(landSize);
    const before = spilled;
    simStep();
    simStep();
    for (let i = 0; i < N; i++) {
      if (fl[i] && --fl[i] === 0) g[i] = 0;
    }
    if (spilled !== before) {
      Sfx.spill();
      updateHUD();
      if (spilled >= SPILL_MAX) { gameOver(true); return; }
    }
    frameNo++;
    if (frameNo % 5 === 0) checkClear();
  }

  function applyTransform() {
    const r = theta * Math.PI / 180, c = Math.abs(Math.cos(r)), s = Math.abs(Math.sin(r));
    const bw = FW * c + FH * s, bh = FW * s + FH * c;
    const k = Math.min(1, AW / bw, AH / bh);
    K = k;
    frame.style.transform = 'rotate(' + theta.toFixed(2) + 'deg) scale(' + k.toFixed(4) + ')';
  }

  function render(t) {
    for (let i = 0; i < N; i++) {
      const c = g[i];
      if (!c) { buf[i] = 0; continue; }
      const f = fl[i];
      buf[i] = (f && ((f >> 1) & 1)) ? WHITE : pal[(c - 1) * SHADES + sh[i]];
    }
    octx.putImageData(img, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(off, 0, 0, cv.width, cv.height);

    const pulse = blocked > 0 ? 0.55 + 0.45 * Math.sin(t * 0.02) : 0.55;
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.strokeStyle = dangerColor;
    ctx.lineWidth = 2 * DPR;
    ctx.setLineDash([8 * DPR, 6 * DPR]);
    ctx.beginPath();
    ctx.moveTo(0, WARN_ROW * CELL);
    ctx.lineTo(cv.width, WARN_ROW * CELL);
    ctx.stroke();
    ctx.restore();

    if (state === 'play' && cur && cool === 0 && GY >= 0) {
      const x0 = Math.round(dropX), col = PAL[cur.c - 1];
      ctx.save();
      if (GY === 1 && GX === 0) { // landing guide
        let top = H;
        for (let x = x0; x < x0 + cur.w; x++) {
          let y = cur.h;
          while (y < H && !g[y * W + x]) y++;
          if (y < top) top = y;
        }
        ctx.globalAlpha = 0.14;
        ctx.fillStyle = col;
        ctx.fillRect(x0 * CELL, cur.h * CELL, cur.w * CELL, Math.max(0, top - cur.h) * CELL);
      }
      ctx.globalAlpha = 0.92; // the sand being held
      ctx.fillStyle = col;
      for (let y = 0; y < cur.h; y++) for (let x = 0; x < cur.w; x++) {
        if ((y === 0 || y === cur.h - 1) && (x === 0 || x === cur.w - 1)) continue;
        ctx.fillRect((x0 + x) * CELL, y * CELL, CELL, CELL);
      }
      ctx.globalAlpha = 0.6;
      ctx.strokeStyle = inkColor;
      ctx.lineWidth = 1.5 * DPR;
      ctx.setLineDash([4 * DPR, 3 * DPR]);
      ctx.strokeRect(x0 * CELL + 0.5, 0.5, cur.w * CELL - 1, cur.h * CELL - 1);
      const ratio = Math.max(0, 1 - holdT / holdLimit()); // time until auto-drop
      ctx.globalAlpha = 1;
      ctx.setLineDash([]);
      ctx.fillStyle = ratio < 0.25 ? dangerColor : col;
      ctx.fillRect(0, 0, cv.width * ratio, 3 * DPR);
      ctx.restore();
    }
  }

  function readTheme() {
    const cs = getComputedStyle(document.documentElement);
    dangerColor = cs.getPropertyValue('--danger').trim() || dangerColor;
    inkColor = cs.getPropertyValue('--ink').trim() || inkColor;
  }

  let last = 0, acc = 0, themeT = 0;
  function loop(t) {
    requestAnimationFrame(loop);
    if (!last) last = t;
    const dt = Math.min(50, t - last);
    last = t;
    acc += dt;
    while (acc >= 16.667) { tick(); acc -= 16.667; }
    if (!dragging) {
      const d = thetaT - theta;
      theta = Math.abs(d) < 0.05 ? thetaT : theta + d * Math.min(1, dt * 0.014);
    }
    applyTransform();
    if (t - themeT > 500) { readTheme(); themeT = t; }
    render(t);
  }

  function resize() {
    DPR = window.devicePixelRatio || 1;
    AW = stage.clientWidth - 24;
    AH = stage.clientHeight - 16;
    const css = Math.max(1, Math.min((AW - 10) / W, (AH - 5) / H));
    CELL = Math.max(2, Math.floor(css * DPR));
    cv.width = W * CELL;
    cv.height = H * CELL;
    cv.style.width = (W * CELL / DPR) + 'px';
    cv.style.height = (H * CELL / DPR) + 'px';
    FW = W * CELL / DPR + 10;
    FH = H * CELL / DPR + 5;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

  const muteBtn = $('muteBtn');
  const syncMute = () => { muteBtn.classList.toggle('off', Sfx.muted); muteBtn.setAttribute('aria-pressed', String(Sfx.muted)); };
  muteBtn.addEventListener('click', () => {
    Sfx.setMuted(!Sfx.muted);
    syncMute();
    if (!Sfx.muted) Sfx.click();
  });
  syncMute();

  buildTitle();
  buildRules();
  readTheme();
  resize();
  setGravity();
  show('vHome');
  ensureFb().catch(e => console.warn('Firebase init failed:', e)); // sign in anonymously in the background
  requestAnimationFrame(loop);
})();
</script>
</body>
